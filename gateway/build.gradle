dependencies {
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')

    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.security:spring-security-test'
    // Integration tests run Redis with the real config and ACL (infra/redis).
    testImplementation 'org.testcontainers:testcontainers'
}

// bootRun takes its two secrets from the .env that infra/vault/vault.mjs renders, so
// a rotated value reaches dev with a restart. Without the file, application.yml's
// dev defaults apply. A variable set in the shell wins. Images never see this.
tasks.named('bootRun') {
    def envFile = rootProject.file('infra/.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def match = line =~ /^(GATEWAY_CLIENT_SECRET|REDIS_PASSWORD)=(.*)$/
            if (match && !System.getenv(match[0][1])) {
                environment match[0][1], match[0][2].replaceFirst(/^'(.*)'$/, '$1')
            }
        }
    }
}

// Build info for /actuator/info.
springBoot {
    buildInfo()
}
