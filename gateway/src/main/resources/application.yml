spring:
  application:
    name: gateway

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          gateway:
            provider: keycloak
            client-id: gateway
            client-secret: ${GATEWAY_CLIENT_SECRET:gateway-dev-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
            - openid
            - profile
            - email
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/playground

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Profile of the logged-in user: the browser calls the gateway
            # with no token, the gateway relays the access token to the API.
            - id: bff-me
              uri: http://localhost:8182
              predicates:
                - Path=/bff/me
              filters:
                - SetPath=/api/me
                - TokenRelay
            - id: bff-admin
              uri: http://localhost:8182
              predicates:
                - Path=/bff/admin
              filters:
                - SetPath=/api/admin
                - TokenRelay
            - id: bff-user-compatibility
              uri: http://localhost:8182
              predicates:
                - Path=/bff/user
              filters:
                - SetPath=/api/me
                - TokenRelay
            - id: api
              uri: http://localhost:8182
              predicates:
                - Path=/api/**
              filters:
                - TokenRelay

server:
  port: 8181
  reactive:
    session:
      cookie:
        # The back-channel logout handler replays this name (SecurityConfig).
        name: SESSION
        http-only: true
        # Lax, not Strict: the redirect back from Keycloak is a top-level
        # navigation that must carry the pre-login session.
        same-site: lax
        # Off for plain http in dev. Set COOKIE_SECURE=true behind https;
        # the XSRF-TOKEN cookie follows the same setting.
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
