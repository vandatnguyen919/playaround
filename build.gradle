plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
}

allprojects {
    group = 'dev.playground'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(26)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
        testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // Local observability only: on the bootRun classpath, left out of bootJar
        // and so of the images. Phase 2 moves it to implementation (PRODUCT.md).
        // Needs its own platform line: bootJar resolves this configuration alone.
        developmentOnly platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
        developmentOnly 'org.springframework.boot:spring-boot-starter-opentelemetry'
    }

    // Shared test helpers (Keycloak in Testcontainers with the realm applied by
    // keycloak-config-cli, a cookie jar browser), compiled into each module's tests.
    sourceSets.test.java.srcDir rootProject.file('testing/java')

    tasks.named('test') {
        useJUnitPlatform()
        // Test names and results in the console, so ./verify and CI logs show what ran.
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'full'
        }
    }

    // Traces, metrics and logs for infra/docker-compose.yml's lgtm service.
    tasks.named('bootRun') {
        systemProperty 'spring.config.additional-location', "file:${rootDir}/infra/otel/application-dev.yml"
    }
}
