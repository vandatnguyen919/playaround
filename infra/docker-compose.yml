name: authn-authz-playground

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak-theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/keycloak-theme.jar:ro
    ports:
      - "8080:8080"
    healthcheck:
      # No curl/wget in the image; probe the management port with bash /dev/tcp
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      # First boot runs a Quarkus build; allow plenty of time before failing
      start_period: 180s

  # Applies playground-realm.json (and the dev test users) through the admin
  # API, then exits. Runs on every `up`, so realm edits land without a wipe and
  # admin console drift is put back. Rerun alone: docker compose up keycloak-config
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KEYCLOAK_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: /config/playground-realm.json,/config/playground-users-dev.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Re-apply even when the files are unchanged, to undo console edits.
      IMPORT_CACHE_ENABLED: "false"
      # Resolved into the realm files as $(env:NAME)
      APP_URL: http://localhost:5174
      GATEWAY_BACKCHANNEL_LOGOUT_URL: http://host.docker.internal:8181/logout/connect/back-channel/gateway
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:-gateway-dev-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-not-configured}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-github-client-id-not-configured}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-github-client-secret-not-configured}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: keycloak@playground.local
      SMTP_SSL: "false"
      SMTP_STARTTLS: "false"
      SMTP_AUTH: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    volumes:
      - ./playground-realm.json:/config/playground-realm.json:ro
      - ./playground-users-dev.json:/config/playground-users-dev.json:ro
    restart: "no"

  # Password and ACL from start.sh, policy in redis/redis.conf. The gateway
  # signs in as user "gateway" (REDIS_PASSWORD); the default user is off.
  redis:
    image: redis:8.10-alpine
    entrypoint: ["/bin/sh", "/usr/local/etc/redis/start.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/start.sh:/usr/local/etc/redis/start.sh:ro
      - redis-data:/data
    ports:
      # Loopback only: the gateway runs on the host in dev.
      - "127.0.0.1:6379:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user gateway ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025" # Web UI + API
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
