# Redis for the gateway: sessions (spring:session:*), the OIDC session registry
# (playground:oidc:*) and rate limiter buckets (request_rate_limiter.*). Every
# key has a TTL. Used by infra/docker-compose.yml and
# deploy/compose/compose.prod.yml. Decisions: PRODUCT.md, "Redis".

port 6379
# Reached only over the compose network (prod: an internal network, no
# published port; dev: published on 127.0.0.1 only). Users and passwords come
# from the ACL file that start.sh writes; the default user is off.
bind * -::*
protected-mode yes

# Persistence: RDB snapshots, no AOF. A restart or redeploy keeps the sessions
# of the last snapshot, so most users stay signed in; at worst the last five
# minutes of logins are lost and those users sign in again. The dump holds
# refresh tokens, so it stays on the VM's volume and is never backed up.
save 300 1
save 60 1000
appendonly no
dir /data
dbfilename dump.rdb

# Memory: about 3 to 5 KB per session (two tokens and the security context),
# so 96 MB holds well over 10,000 sessions. When full, evict the keys closest
# to expiry first: rate limiter buckets (seconds) and sessions near their idle
# timeout go before the OIDC registry (10 hours), which back-channel logout
# needs to find a live session. noeviction would fail every new login instead.
maxmemory 96mb
maxmemory-policy volatile-ttl
