# Publishes the docs site (Docusaurus, docs/) to GitHub Pages at
# https://vandatnguyen919.github.io/playaround/. Only on main, and only when
# docs/ or this file changes. Pull requests build the site in ci.yml (job docs)
# and publish nothing.
# Needs once, in the repo settings: Pages, Source "GitHub Actions".
# The build job runs ./verify docs: the Docusaurus build (broken links fail it)
# and docs/check-public.mjs, so nothing is uploaded unless the scan is clean.
# Only the deploy job gets pages: write and id-token: write.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm --prefix docs ci
      - run: ./verify docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
