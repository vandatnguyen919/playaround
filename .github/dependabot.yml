# Weekly update PRs. Minor and patch updates are grouped per ecosystem; majors
# come one PR each. PRODUCT.md pins the main versions (Spring Boot, Keycloak,
# Keycloakify, Java), so those PRs are proposals for Dan, not auto-merged.
# Every PR runs ci.yml, including Trivy and dependency review.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { update-types: [minor, patch] }

  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    groups:
      gradle: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directories: [/web, /keycloak-theme]
    schedule: { interval: weekly }
    groups:
      npm: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/gateway, /api, /keycloak-theme]
    schedule: { interval: weekly }
    groups:
      docker: { update-types: [minor, patch] }

  - package-ecosystem: docker-compose
    directories: [/infra, /deploy/compose]
    schedule: { interval: weekly }
    groups:
      compose: { update-types: [minor, patch] }
