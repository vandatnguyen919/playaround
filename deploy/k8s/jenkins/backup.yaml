# Daily backup of JENKINS_HOME. The repo and two Secrets rebuild everything else,
# so the archive holds only what they cannot: each job's build history and next
# build number. It leaves out the master key, encrypted credentials and users, so
# a copy of it opens nothing. Where it goes is the overlay's job: it supplies
# ConfigMap jenkins-backup-upload with upload.sh (overlays/azure for the VM).
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-backup-archive
  namespace: ci
data:
  archive.sh: |
    set -eu
    cd /jenkins-home
    out="/out/jenkins-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
    list="$(find jobs -mindepth 2 -maxdepth 2 \( -name builds -o -name nextBuildNumber \) 2>/dev/null || true)"
    if [ -z "$list" ]; then
      echo "no build history yet, nothing to back up"
      exit 0
    fi
    # Jenkins is live: tar exits 1 when a log grows while being read, which is fine.
    rc=0
    # shellcheck disable=SC2086
    tar -czf "$out" $list || rc=$?
    [ "$rc" -le 1 ] || exit "$rc"
    echo "archived $(tar -tzf "$out" | wc -l) entries, $(wc -c < "$out") bytes"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jenkins-backup
  namespace: ci
spec:
  # 19:30 UTC, after the database dump and before the 20:00 reboot window.
  schedule: "30 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jenkins-backup
        spec:
          restartPolicy: Never
          priorityClassName: ci
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: archive
              image: jenkins/jenkins:2.580.1-lts-jdk25
              command: [sh, /scripts/archive.sh]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: jenkins-home, mountPath: /jenkins-home, readOnly: true }
                - { name: out, mountPath: /out }
                - { name: archive-script, mountPath: /scripts, readOnly: true }
          containers:
            - name: upload
              image: jenkins/jenkins:2.580.1-lts-jdk25
              command: [sh, /scripts/upload.sh]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: out, mountPath: /out, readOnly: true }
                - { name: upload-script, mountPath: /scripts, readOnly: true }
                - { name: work, mountPath: /work }
          volumes:
            - name: jenkins-home
              persistentVolumeClaim:
                claimName: jenkins
            - name: out
              emptyDir: { sizeLimit: 512Mi }
            - name: work
              emptyDir: { sizeLimit: 64Mi }
            - name: archive-script
              configMap: { name: jenkins-backup-archive }
            - name: upload-script
              configMap: { name: jenkins-backup-upload }
