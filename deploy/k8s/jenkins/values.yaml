# Jenkins for CD only, chart jenkins/jenkins 5.10.0. CI is GitHub Actions; this
# deploys images it published and builds nothing. Everything Jenkins knows comes
# from this file, plugins.yaml, base.yaml and one Secret (see README.md):
# overwriteConfiguration and overwritePlugins make each start rebuild the config
# and plugins from here, so a change made in the UI lasts until the next restart.
fullnameOverride: jenkins

controller:
  image:
    tag: 2.580.1-lts-jdk25
    pullPolicy: IfNotPresent
  # No local users: sign-in is OIDC only.
  admin:
    createSecret: false
  numExecutors: 0
  executorMode: EXCLUSIVE
  disableRememberMe: true
  priorityClassName: ci

  # PRODUCT.md gives Jenkins 1.0 GB. This 640 Mi plus the one agent pod's 384 Mi
  # (see the cloud below) is exactly 1024 Mi. Heap is capped well under the limit
  # because metaspace, code cache and threads live outside it.
  resources:
    requests: { cpu: 100m, memory: 640Mi }
    limits: { cpu: "1", memory: 640Mi }
  # Runs before the controller, never beside it. The plugin tool parses the update
  # center's large JSON files and fails with 96 MB of heap.
  initContainerResources:
    requests: { cpu: 100m, memory: 640Mi }
    limits: { cpu: "1", memory: 640Mi }
  initContainerEnv:
    - name: JDK_JAVA_OPTIONS
      value: -XX:MaxRAMPercentage=75
  javaOpts: >-
    -XX:MaxRAMPercentage=50
    -XX:+UseSerialGC
    -XX:MaxMetaspaceSize=192m
    -XX:ReservedCodeCacheSize=64m
    -Xss512k
    -Dhudson.model.UsageStatistics.disabled=true

  containerEnv:
    - name: PLAYGROUND_REPO_URL
      value: https://github.com/vandatnguyen919/playaround.git
    # Keycloak runs in compose on this VM, so a pod reaches it by its public name.
    - name: KEYCLOAK_WELL_KNOWN_URL
      value: https://auth.tickin.me/realms/playground/.well-known/openid-configuration
    # Where deploys go: the VM's private address, since Azure allows SSH on the public
    # one from Dan's IP alone. The host key is public, and pinned so a machine answering
    # in the VM's place gets no deploy. After a VM rebuild it changes: update it here.
    - name: VM_TARGET
      value: playground@10.20.1.4
    - name: VM_KNOWN_HOSTS
      value: 10.20.1.4 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEsJQiJwD4RGhZnA/Fr0jgoHKgZ/fi5gWsL2Hpu82XTe
    - name: IMAGE_PREFIX
      value: ghcr.io/vandatnguyen919/playground-
    - name: GITHUB_API
      value: https://api.github.com
    - name: NOTIFY_SMTP_URL
      value: smtp://smtp.resend.com:587
    - name: NOTIFY_FROM
      value: no-reply@tickin.me
    # Empty on the real install. The drill sets these for its own registry and certs.
    - name: NOTIFY_PLAIN_SMTP
      value: ""
    - name: SSL_CERT_FILE
      value: ""
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: ""
    - name: POLL_SECONDS
      value: "120"

  # No public exposure: ClusterIP only, no Ingress, reached through a tunnel.
  # Agents connect by WebSocket on 8080, so the inbound agent port stays closed.
  ingress:
    enabled: false
  serviceType: ClusterIP
  agentListenerEnabled: false

  # A slow arm64 start with 60 plugins takes minutes. The probes hit /login, which
  # answers without Keycloak, so a Keycloak outage never restarts Jenkins.
  probes:
    startupProbe:
      failureThreshold: 60

  # All plugins are pinned (plugins.yaml), dependencies included. Nothing floats.
  installLatestPlugins: false
  installLatestSpecifiedPlugins: false
  overwritePlugins: true
  overwritePluginsFromImage: true

  # Mounted under /run/secrets/additional; JCasC reads them as ${<name>-<key>}.
  additionalExistingSecrets:
    - name: jenkins-secrets
      keyName: oidc-client-secret
    - name: jenkins-secrets
      keyName: vm-deploy-key
    - name: jenkins-secrets
      keyName: notify-smtp-user
    - name: jenkins-secrets
      keyName: notify-smtp-password
    - name: jenkins-secrets
      keyName: notify-recipient

  sidecars:
    # Config changes go through install.sh and a restart. Saves about 100 MB.
    configAutoReload:
      enabled: false

  JCasC:
    defaultConfig: false
    overwriteConfiguration: true
    configScripts:
      security: |
        jenkins:
          systemMessage: "Configured as code from deploy/k8s/jenkins. Changes made here are lost on restart."
          numExecutors: 0
          mode: EXCLUSIVE
          disableRememberMe: true
          slaveAgentPort: -1
          securityRealm:
            oic:
              clientId: jenkins
              clientSecret: "${jenkins-secrets-oidc-client-secret}"
              serverConfiguration:
                wellKnown:
                  wellKnownOpenIDConfigurationUrl: "${KEYCLOAK_WELL_KNOWN_URL}"
                  scopesOverride: "openid profile email"
              userNameField: preferred_username
              fullNameFieldName: name
              emailFieldName: email
              groupsFieldName: groups
              logoutFromOpenidProvider: true
              postLogoutRedirectUrl: "http://localhost:8090/"
              avatarHandler: noAvatar
              properties:
                - pkce
          # The realm has public registration, so signing in proves nothing. Only
          # the realm role jenkins-admin gets any permission, reading included.
          authorizationStrategy:
            globalMatrix:
              entries:
                - group:
                    name: jenkins-admin
                    permissions:
                      - Overall/Administer
          crumbIssuer: standard
        security:
          apiToken:
            creationOfLegacyTokenEnabled: false
            tokenGenerationOnCreationEnabled: false
        unclassified:
          location:
            url: "http://localhost:8090/"
      agents: |
        jenkins:
          globalNodeProperties:
            - envVars:
                env:
                  - key: VM_TARGET
                    value: "${VM_TARGET}"
                  - key: VM_KNOWN_HOSTS
                    value: "${VM_KNOWN_HOSTS}"
                  - key: IMAGE_PREFIX
                    value: "${IMAGE_PREFIX}"
                  - key: GITHUB_API
                    value: "${GITHUB_API}"
                  - key: NOTIFY_SMTP_URL
                    value: "${NOTIFY_SMTP_URL}"
                  - key: NOTIFY_FROM
                    value: "${NOTIFY_FROM}"
                  - key: NOTIFY_PLAIN_SMTP
                    value: "${NOTIFY_PLAIN_SMTP:-}"
                  - key: SSL_CERT_FILE
                    value: "${SSL_CERT_FILE:-}"
                  - key: NODE_TLS_REJECT_UNAUTHORIZED
                    value: "${NODE_TLS_REJECT_UNAUTHORIZED:-}"
                  - key: POLL_SECONDS
                    value: "${POLL_SECONDS}"
          clouds:
            - kubernetes:
                name: kubernetes
                serverUrl: https://kubernetes.default.svc
                namespace: ci
                jenkinsUrl: http://jenkins.ci.svc.cluster.local:8080
                webSocket: true
                # One agent pod at most, or the memory budget above does not hold.
                containerCapStr: "1"
                retentionTimeout: 5
                templates:
                  # Fixed, or Jenkins makes a new random id at each start.
                  - id: deploy
                    name: deploy
                    label: deploy
                    nodeUsageMode: EXCLUSIVE
                    idleMinutes: 0
                    slaveConnectTimeout: 300
                    showRawYaml: false
                    yaml: |
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        labels:
                          app.kubernetes.io/component: jenkins-agent
                      spec:
                        priorityClassName: ci
                        # No cluster rights at all. It deploys over SSH, with a key it
                        # gets only inside withCredentials, from the credential store.
                        automountServiceAccountToken: false
                        enableServiceLinks: false
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                          fsGroup: 1000
                          seccompProfile:
                            type: RuntimeDefault
                        # The agent image has ssh, curl and git. These add node (smoke,
                        # cd-gate) and buildx (provenance) from pinned images, so there
                        # is no custom image to build and keep up to date.
                        initContainers:
                          - name: tool-node
                            image: node:22.20.0-slim
                            command: [cp, /usr/local/bin/node, /tools/node]
                            resources:
                              requests: { cpu: 50m, memory: 64Mi }
                              limits: { cpu: 500m, memory: 64Mi }
                            securityContext:
                              allowPrivilegeEscalation: false
                              capabilities: { drop: [ALL] }
                            volumeMounts:
                              - { name: tools, mountPath: /tools }
                          - name: tool-buildx
                            image: docker:29.1.5-cli
                            command: [cp, /usr/local/libexec/docker/cli-plugins/docker-buildx, /tools/docker-buildx]
                            resources:
                              requests: { cpu: 50m, memory: 64Mi }
                              limits: { cpu: 500m, memory: 64Mi }
                            securityContext:
                              allowPrivilegeEscalation: false
                              capabilities: { drop: [ALL] }
                            volumeMounts:
                              - { name: tools, mountPath: /tools }
                        containers:
                          - name: jnlp
                            image: jenkins/inbound-agent:3395.v6e5377b_0fb_3c-3-jdk25
                            env:
                              - name: JAVA_OPTS
                                value: -Xmx96m -XX:+UseSerialGC -Xss512k
                              - name: NODE_OPTIONS
                                value: --max-old-space-size=96
                            resources:
                              requests: { cpu: 50m, memory: 384Mi }
                              limits: { cpu: 500m, memory: 384Mi }
                            securityContext:
                              allowPrivilegeEscalation: false
                              capabilities: { drop: [ALL] }
                            volumeMounts:
                              - { name: tools, mountPath: /tools, readOnly: true }
                        volumes:
                          - name: tools
                            emptyDir: {}
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  # Limited on the VM to vm-ssh-gate.sh: deploy commands and the smoke
                  # calls, no shell. See vm-deploy.sh add-deploy-key.
                  - basicSSHUserPrivateKey:
                      scope: GLOBAL
                      id: vm-deploy-key
                      username: playground
                      description: Deploys to the VM through vm-ssh-gate.sh
                      privateKeySource:
                        directEntry:
                          privateKey: "${jenkins-secrets-vm-deploy-key}"
                  - usernamePassword:
                      scope: GLOBAL
                      id: notify-smtp
                      description: SMTP login for deploy notifications
                      username: "${jenkins-secrets-notify-smtp-user}"
                      password: "${jenkins-secrets-notify-smtp-password}"
                  - string:
                      scope: GLOBAL
                      id: notify-recipient
                      description: Who gets deploy notifications
                      secret: "${jenkins-secrets-notify-recipient}"
      jobs: |
        jobs:
          - script: |
              pipelineJob('deploy-playground') {
                description('For each new commit on main: waits for CI and its images, checks provenance, asks for approval, deploys by digest over SSH, runs smoke, rolls back on failure.')
                // Part of the deploy history, with deploys.log on the VM.
                logRotator { numToKeep(100) }
                properties {
                  disableConcurrentBuilds()
                  pipelineTriggers {
                    triggers {
                      // No webhooks, since nothing here is public. Up to 5 minutes of delay.
                      pollSCM { scmpoll_spec('H/5 * * * *') }
                    }
                  }
                }
                definition {
                  cpsScm {
                    lightweight(true)
                    scriptPath('deploy/k8s/jenkins/deploy.Jenkinsfile')
                    scm {
                      git {
                        remote { url(System.getenv('PLAYGROUND_REPO_URL')) }
                        branch('*/main')
                      }
                    }
                  }
                }
              }
              pipelineJob('rollback-playground') {
                description('One click: back to the newest good release that is not running now, then smoke. Click again to go one further back.')
                logRotator { numToKeep(100) }
                properties {
                  disableConcurrentBuilds()
                }
                definition {
                  cpsScm {
                    lightweight(true)
                    scriptPath('deploy/k8s/jenkins/rollback.Jenkinsfile')
                    scm {
                      git {
                        remote { url(System.getenv('PLAYGROUND_REPO_URL')) }
                        branch('*/main')
                      }
                    }
                  }
                }
              }

# JENKINS_HOME: build history. Sizes well under this with 100 builds per job kept.
persistence:
  enabled: true
  size: 4Gi

# The chart's Role lets the controller run agent pods in namespace ci, nothing else.
rbac:
  create: true
  readSecrets: false

agent:
  enabled: false
