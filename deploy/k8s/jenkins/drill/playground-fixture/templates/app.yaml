apiVersion: v1
kind: ConfigMap
metadata:
  name: deployed
data:
  imageTag: {{ .Values.imageTag | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture
spec:
  replicas: 1
  selector:
    matchLabels: { app: fixture }
  template:
    metadata:
      labels: { app: fixture }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pause
          image: rancher/mirrored-pause:3.6
          resources:
            limits: { memory: 16Mi }
