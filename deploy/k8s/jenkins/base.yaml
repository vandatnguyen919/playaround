# What the chart does not create. Applied by install.sh before the chart.
apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
# Under memory pressure Jenkins goes first (PRODUCT.md). Negative, so it ranks
# below any pod with no class at all, and it never evicts anything to fit.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci
value: -100
preemptionPolicy: Never
description: Jenkins and its deploy agent. First to go under memory pressure.
---
# Nothing outside the namespace reaches Jenkins; a tunnel goes through
# kubectl port-forward, which these rules do not see.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ci-ingress-only-from-ci
  namespace: ci
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# The VM's managed identity is reachable from any pod through this address, so
# only the backup job may call it (PRODUCT.md, VM identity).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ci-no-instance-metadata
  namespace: ci
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [jenkins-backup]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
