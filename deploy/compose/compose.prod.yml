# Phase 1 production stack: Traefik, Keycloak (production mode, custom
# image), Postgres, keycloak-config-cli for the realm, Redis, the gateway
# (BFF, serves the SPA) and the API.
#
#   cp .env.example .env    # fill in every value
#   docker compose -f compose.prod.yml pull && docker compose -f compose.prod.yml up -d
# (or `up -d --build` to build the images here instead of pulling from GHCR)
#
# Public: https://${APP_HOST} is the gateway (SPA, /bff, /api, login and
# logout). https://${AUTH_HOST} serves only /realms/playground/ and
# /resources/. Not public: the admin console and admin API (Traefik has no
# route for them), the master realm, health and metrics (Keycloak 9000,
# gateway 9181, never published), the API (backend network only, reached
# through the gateway), and Redis (backend network only, password and ACL).
# Admin console over an SSH tunnel:
#   ssh -L 8080:127.0.0.1:8080 <vm>   then   http://localhost:8080/admin/
name: playground-prod

services:
  traefik:
    image: traefik:v3.7.16
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=playground-prod_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Let's Encrypt staging until a cert issues (rate limits). Production:
      # https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      edge:
        # Fixed so Keycloak trusts X-Forwarded-* from this address only.
        ipv4_address: 172.30.10.10
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - keycloak-db:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: ${KEYCLOAK_IMAGE:-ghcr.io/vandatnguyen919/playground-keycloak:latest}
    build: ../../keycloak-theme
    # The image runs `start --optimized` (production mode, prebuilt).
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}
      # Public URL. Issuer, redirects and links are built from it, never from
      # request headers, so a forged X-Forwarded-Host cannot change them.
      KC_HOSTNAME: https://${AUTH_HOST:?set AUTH_HOST}
      # The admin console lives at the tunnel URL, not the public one.
      KC_HOSTNAME_ADMIN: http://localhost:${KC_ADMIN_PORT:-8080}
      # Services on the compose network (gateway, keycloak-config) may call
      # http://keycloak:8080 for back-channel requests.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # TLS ends at Traefik; Keycloak speaks plain HTTP on the private network.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.30.10.10
      # First boot only (empty database). The client is what keycloak-config
      # signs in with; the user is for the admin console over the tunnel.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: ${KC_CONFIG_CLIENT_ID:?set KC_CONFIG_CLIENT_ID}
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: ${KC_CONFIG_CLIENT_SECRET:?set KC_CONFIG_CLIENT_SECRET}
    ports:
      # Loopback only: reached through an SSH tunnel, never the internet.
      - "127.0.0.1:${KC_ADMIN_PORT:-8080}:8080"
    networks: [edge, backend]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the image; probe the management port with bash /dev/tcp
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.rule=Host(`${AUTH_HOST}`) && (PathPrefix(`/realms/playground/`) || PathPrefix(`/resources/`))
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=${TLS_CERT_RESOLVER-le}
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      # Abuse limits per client IP on the form posts that check a password,
      # create an account or send mail. Traefik is the edge (Cloudflare is DNS
      # only), so the remote address is the client: the ratelimit default
      # source. One router per group, so each group has its own buckets;
      # priority beats the catch-all router above. Over the limit: 429.
      # Values and reasons: PRODUCT.md, Auth abuse protection.
      - traefik.http.routers.keycloak-login.entrypoints=websecure
      - traefik.http.routers.keycloak-login.rule=Host(`${AUTH_HOST}`) && Path(`/realms/playground/login-actions/authenticate`)
      - traefik.http.routers.keycloak-login.priority=100
      - traefik.http.routers.keycloak-login.middlewares=kc-login-limit
      - traefik.http.routers.keycloak-login.service=keycloak
      - traefik.http.routers.keycloak-login.tls=true
      - traefik.http.routers.keycloak-login.tls.certresolver=${TLS_CERT_RESOLVER-le}
      - traefik.http.middlewares.kc-login-limit.ratelimit.average=10
      - traefik.http.middlewares.kc-login-limit.ratelimit.period=1m
      - traefik.http.middlewares.kc-login-limit.ratelimit.burst=10
      - traefik.http.routers.keycloak-register.entrypoints=websecure
      - traefik.http.routers.keycloak-register.rule=Host(`${AUTH_HOST}`) && (Path(`/realms/playground/login-actions/registration`) || Path(`/realms/playground/protocol/openid-connect/registrations`))
      - traefik.http.routers.keycloak-register.priority=100
      - traefik.http.routers.keycloak-register.middlewares=kc-register-limit
      - traefik.http.routers.keycloak-register.service=keycloak
      - traefik.http.routers.keycloak-register.tls=true
      - traefik.http.routers.keycloak-register.tls.certresolver=${TLS_CERT_RESOLVER-le}
      - traefik.http.middlewares.kc-register-limit.ratelimit.average=5
      - traefik.http.middlewares.kc-register-limit.ratelimit.period=1m
      - traefik.http.middlewares.kc-register-limit.ratelimit.burst=5
      - traefik.http.routers.keycloak-reset.entrypoints=websecure
      - traefik.http.routers.keycloak-reset.rule=Host(`${AUTH_HOST}`) && Path(`/realms/playground/login-actions/reset-credentials`)
      - traefik.http.routers.keycloak-reset.priority=100
      - traefik.http.routers.keycloak-reset.middlewares=kc-reset-limit
      - traefik.http.routers.keycloak-reset.service=keycloak
      - traefik.http.routers.keycloak-reset.tls=true
      - traefik.http.routers.keycloak-reset.tls.certresolver=${TLS_CERT_RESOLVER-le}
      - traefik.http.middlewares.kc-reset-limit.ratelimit.average=5
      - traefik.http.middlewares.kc-reset-limit.ratelimit.period=1m
      - traefik.http.middlewares.kc-reset-limit.ratelimit.burst=5
    restart: unless-stopped

  # Applies the realm through the admin API on every `up`, then exits.
  # Rerun alone: docker compose -f compose.prod.yml up keycloak-config
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_GRANTTYPE: client_credentials
      KEYCLOAK_CLIENTID: ${KC_CONFIG_CLIENT_ID}
      KEYCLOAK_CLIENTSECRET: ${KC_CONFIG_CLIENT_SECRET}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      # No test users here; those are in playground-users-dev.json (dev only).
      IMPORT_FILES_LOCATIONS: /config/playground-realm.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Re-apply even when the file is unchanged, to undo console edits.
      IMPORT_CACHE_ENABLED: "false"
      # Resolved into the realm file as $(env:NAME)
      APP_URL: https://${APP_HOST:?set APP_HOST}
      GATEWAY_BACKCHANNEL_LOGOUT_URL: http://gateway:8181/logout/connect/back-channel/gateway
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?set GATEWAY_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
    volumes:
      - ../../infra/playground-realm.json:/config/playground-realm.json:ro
    networks: [backend]
    restart: "no"

  # Points the master realm (admin console sign-in) at the tunnel URL, since
  # Traefik does not route /realms/master. Separate from keycloak-config and
  # run after it: the change also moves the master token issuer, so any admin
  # call after it with an older token gets 401. This is the last call here.
  keycloak-admin-url:
    image: ${KEYCLOAK_IMAGE:-ghcr.io/vandatnguyen919/playground-keycloak:latest}
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
    environment:
      KC_CONFIG_CLIENT_ID: ${KC_CONFIG_CLIENT_ID}
      KC_CONFIG_CLIENT_SECRET: ${KC_CONFIG_CLIENT_SECRET}
      KC_ADMIN_URL: http://localhost:${KC_ADMIN_PORT:-8080}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        kcadm=/opt/keycloak/bin/kcadm.sh;
        $$kcadm config credentials --config /tmp/kcadm.config --server http://keycloak:8080
        --realm master --client "$$KC_CONFIG_CLIENT_ID" --secret "$$KC_CONFIG_CLIENT_SECRET" &&
        $$kcadm update realms/master --config /tmp/kcadm.config -s "attributes.frontendUrl=$$KC_ADMIN_URL"
    networks: [backend]
    restart: "no"

  # Sessions, OIDC session registry and rate limiter buckets for the gateway.
  # Only on the internal backend network: no published port, no route out.
  # The gateway signs in as user "gateway" with REDIS_PASSWORD; the default
  # user is off. Policy (RDB snapshots, 96 MB, volatile-ttl): redis.conf.
  redis:
    image: redis:8.10-alpine
    entrypoint: ["/bin/sh", "/usr/local/etc/redis/start.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - ../../infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ../../infra/redis/start.sh:/usr/local/etc/redis/start.sh:ro
      - redis-data:/data
    networks: [backend]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user gateway ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The BFF. Public at https://${APP_HOST}: serves the SPA from the image
  # (web/dist), holds sessions in Redis and relays tokens to the API. Talks to
  # Keycloak over the private network (discovery, tokens, keys); the browser
  # goes to the public AUTH_HOST. Keycloak's back-channel logout reaches it at
  # http://gateway:8181 (keycloak-config).
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/vandatnguyen919/playground-gateway:latest}
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    environment:
      APP_URL: https://${APP_HOST:?set APP_HOST}
      # Issuer in tokens (public); discovery from the private URL, which
      # answers with private token and key endpoints (backchannel dynamic).
      KEYCLOAK_ISSUER_URI: https://${AUTH_HOST:?set AUTH_HOST}/realms/playground
      KEYCLOAK_DISCOVERY_URI: http://keycloak:8080/realms/playground/.well-known/openid-configuration
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?set GATEWAY_CLIENT_SECRET}
      API_URL: http://api:8182
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # TLS ends at Traefik: take scheme and client address from
      # X-Forwarded-*, so HSTS, redirect URIs and rate limit keys are right.
      FORWARD_HEADERS_STRATEGY: native
      COOKIE_SECURE: "true"
      # Management port 9181 for the image's healthcheck; never published.
      MANAGEMENT_ADDRESS: 0.0.0.0
    networks: [edge, backend]
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      # Discovery needs the playground realm, which keycloak-config creates.
      keycloak-config:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.gateway.entrypoints=websecure
      - traefik.http.routers.gateway.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.gateway.tls=true
      - traefik.http.routers.gateway.tls.certresolver=${TLS_CERT_RESOLVER-le}
      - traefik.http.services.gateway.loadbalancer.server.port=8181
    restart: unless-stopped

  # Resource server. Backend network only: the gateway is its one caller.
  # Checks the public issuer; keys come from Keycloak's private URL.
  api:
    image: ${API_IMAGE:-ghcr.io/vandatnguyen919/playground-api:latest}
    build:
      context: ../..
      dockerfile: api/Dockerfile
    environment:
      KEYCLOAK_ISSUER_URI: https://${AUTH_HOST:?set AUTH_HOST}/realms/playground
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/playground/protocol/openid-connect/certs
    networks: [backend]
    mem_limit: 400m
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  backend:
    internal: true

volumes:
  keycloak-db:
  redis-data:
  letsencrypt:
