// KeyLab API: one Spring Modulith app, eight modules plus an open "shared"
// module (docs/keylab/modulith-plan.md). Root package app.keylab.
dependencies {
    implementation platform('org.springframework.modulith:spring-modulith-bom:2.1.0')
    testImplementation platform('org.springframework.modulith:spring-modulith-bom:2.1.0')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // One Postgres schema per module, each migrated by its own Flyway
    // (shared/persistence/ModuleMigrations).
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Module structure and the event publication registry (outbox) over JDBC,
    // so the table can live in the "platform" schema.
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-docs'
    // Postgres for every Spring test, Keycloak for the real token test (testing/java).
    testImplementation 'org.testcontainers:testcontainers'
}
