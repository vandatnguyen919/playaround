    const gap = Math.max(1.4, u * .055);
    const dpx = prof.d * u / 20;
    const hs = Math.max(1.5, u * .07) + prof.d * u / 160;
    const phase = s.phase;
    const pressed = s.pressed || {};
    const arts = { Esc: p.artisanEsc || 'none', Enter: p.artisanEnter || 'none' };
    const f1 = (v) => (Math.round(v * 10) / 10);
    const is3d = !!p.view3d;
    const hk = u * (.26 + prof.d * .035);
    const keys = L.K.map((k) => {
      const art = (k.grp === 'accent' && k.x < 1 && k.l === 'Esc') ? arts.Esc : (k.l === 'Enter' && k.code === 'Enter') ? arts.Enter : 'none';
      const A = art !== 'none' ? KL_ART[art] : null;
      const base = A ? A.body : (ov[k.id] || cols[k.grp]);
      const isP = !!pressed[k.id];
      const light = klLum(base) > .36;
      let lc = KL_LEG[String(base).toUpperCase()] || (light ? klShade(base, -.7) : klShade(base, .8));
      let ts = 'none';
      if (shine) { lc = '#FFE6A0'; ts = '0 0 ' + f1(u * .12) + 'px rgba(255,214,120,.85)'; }
      const lift = phase === 'up';
      const delay = Math.round(k.x * 13 + k.y * 34);
      const word = k.l.length > 1 && !/^F\d+$/.test(k.l);
      const txt = k.l === 'Space' ? '' : k.l;
      const showTop = legend !== 'blank' && legend !== 'front';
      return {
        aria: k.l === 'Space' ? 'Space' : k.l === '\\' ? 'Backslash' : k.l,
        top: A ? '' : (showTop ? txt : ''), scr: A && A.scr ? A.scr : '', scrR: f1(u * .07),
        front: legend === 'front' ? txt : '',
        l: f1(k.x * u), t: f1(k.y * u), w: f1(k.w * u - gap), h: f1(k.h * u - gap),
        side: klShade(base, -.16), r: f1(prof.r * u * .45),
        shadow: isP ? 'none' : f1(hs) + 'px ' + f1(hs) + 'px 0 #000',
        tf: 'translate(' + (isP ? f1(hs) : 0) + 'px, ' + (isP ? f1(hs) : lift ? f1(-u * .75) : 0) + 'px)',
        bw: f1(Math.max(1, u * .045)),
        op: lift ? 0 : 1,
        tr: isP ? 'transform 35ms ease-out, box-shadow 35ms'
          : phase !== 'idle' ? 'transform 260ms cubic-bezier(.3,1.5,.5,1) ' + delay + 'ms, opacity 180ms ease ' + delay + 'ms'
          : 'transform 170ms cubic-bezier(.3,1.9,.5,1), box-shadow 120ms',
        outline: sel[k.id] ? '3px solid #F16B53' : 'none',
        tf3: 'translateZ(' + (isP ? f1(-hk * .55) : lift ? f1(u * 1.4) : 0) + 'px)',
        tr3: isP ? 'transform 35ms ease-out'
          : phase !== 'idle' ? 'transform 260ms cubic-bezier(.3,1.5,.5,1) ' + delay + 'ms, opacity 180ms ease ' + delay + 'ms'
          : 'transform 170ms cubic-bezier(.3,1.9,.5,1)',
        ftop: f1(k.h * u - gap - hk), rl: f1(k.w * u - gap - hk),
        sF: klShade(base, -.22), sB: klShade(base, -.4), sS: klShade(base, -.32),
        tbw: sel[k.id] ? f1(Math.max(2.5, u * .09)) : f1(Math.max(1, u * .045)),
        tbc: sel[k.id] ? '#F16B53' : '#000',
        it: f1(prof.top * u), il: f1(prof.side * u), ib: f1(prof.bot * u * (k.h > 1 ? .6 : 1)), ir: f1(prof.tr * u * .4),
        topBg: A ? A.bg : base,
        topShadow: 'inset 0 0 0 1px rgba(0,0,0,.3)' + (abs ? ', inset ' + f1(u * .06) + 'px ' + f1(u * .06) + 'px 0 rgba(255,255,255,.4)' : ''),
        ai: legend === 'center' || A ? 'center' : 'flex-start',
        jc: legend === 'center' || A ? 'center' : 'flex-start',
        lp: f1(u * .08),
        lc: A ? '#F3C14E' : lc, ts: ts,
        fs: f1(A ? u * .4 : word ? u * .17 : /^F\d+$/.test(k.l) ? u * .19 : u * .27),
        flc: light ? klShade(base, -.6) : klShade(base, .7), ffs: f1(u * .14),
        mark: marks[k.id] || '', ms: f1(u * .16), mr: f1(prof.side * u + u * .06), mt: f1(prof.top * u + u * .06),
        down: (e) => { if (e && e.button > 0) return; this.press(k); },
        up: () => this.release(k),
        click: (e) => { if (e && e.detail === 0) this.flash(k); }
      };
    });
    const cc = p.caseColor || '#2B4677';
    const mat = p.caseMat || 'alu';
    const caseH = L.H * u + pad * 2;
    const tilt = p.tilt !== false;
    const P = width * 2, th = 22 * Math.PI / 180;
    const visH = tilt ? caseH * Math.cos(th) * P / (P + caseH * Math.sin(th)) : caseH;
    const caseBg = mat === 'wood'
      ? 'repeating-linear-gradient(91deg, ' + klShade(cc, .1) + ' 0 6px, ' + cc + ' 6px 14px)'
      : mat === 'pc' ? cc + 'D9'
      : cc;
    const fam = fontKey === 'mono' ? "'Space Mono', ui-monospace, monospace" : fontKey === 'rounded' ? "'Nunito', system-ui, sans-serif" : "'Archivo', system-ui, sans-serif";
    // 3D: orbit = spin on the desk (rz), then tilt the camera (rx); scale to fit the frame
    const caseW = L.W * u + pad * 2;
    const caseT = u * .55;
    const rx = Math.max(0, Math.min(80, p.rx == null ? 50 : +p.rx));
    const rz = p.rz == null ? -28 : +p.rz;
    const ra = rx * Math.PI / 180, za = rz * Math.PI / 180;
    const root3H = Math.round(width * .58);
    const fw = Math.abs(caseW * Math.cos(za)) + Math.abs(caseH * Math.sin(za));
    const fh = (Math.abs(caseW * Math.sin(za)) + Math.abs(caseH * Math.cos(za))) * Math.cos(ra) + (caseT + hk) * Math.sin(ra);
    const s3 = Math.min(1, width / (fw * 1.08), root3H / (fh * 1.2));
    return {
      is3d: is3d, flat: !is3d,
      hk: f1(hk), hkn: f1(-hk),
      root3H: root3H, persp: Math.round(width * 2.2),
      caseW: f1(caseW), caseWh: f1(-caseW / 2), caseHh: f1(-caseH / 2), caseT: f1(caseT), caseTn: f1(-caseT),
      board3Tf: 'scale(' + s3.toFixed(3) + ') rotateX(' + rx + 'deg) rotateZ(' + rz + 'deg)',
      board3Tr: p.instant ? 'none' : 'transform 420ms cubic-bezier(.3,1.25,.5,1)',
      wallF: klShade(cc, -.25), wallB: klShade(cc, -.45), wallS: klShade(cc, -.35),
      deskZ: f1(-caseT - 1), shOff: f1(u * .28),
      keys: keys,
      rootW: width,
      rootH: Math.round(visH + u * .9),
      offY: f1(-(caseH - visH)),
      caseH: f1(caseH),
      tiltTf: tilt ? 'perspective(' + P + 'px) rotateX(22deg)' : 'none',
      caseR: f1(u * .1),
      caseB: f1(Math.max(2, u * .085)),
      caseBg: caseBg,
      caseShadow: f1(u * .22) + 'px ' + f1(u * .22) + 'px 0 #000',
      pad: f1(pad),
      innerW: f1(L.W * u), innerH: f1(L.H * u),
      plateR: f1(u * .12),
      plateBg: klShade(KL_PLATE[p.plate || 'alu'] || KL_PLATE.alu, -.55),
      fontFam: fam
    };
  }
}
</script>
