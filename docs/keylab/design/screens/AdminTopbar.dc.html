<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.atb-field{height:38px;box-sizing:border-box;border:2px solid #000;border-radius:0;background:#FFFFFF;color:#000;font:inherit;font-size:13px;font-weight:600;padding:0 10px}
.atb-field:focus{outline:3px solid #F16B53;outline-offset:1px}
.atb-btn{appearance:none;margin:0;cursor:pointer;width:38px;height:38px;border:2px solid #000;border-radius:0;background:#FFFDF5;color:#000;box-shadow:2px 2px 0 #000;display:flex;align-items:center;justify-content:center;position:relative}
.atb-btn:hover{background:#FFF1C7}
.atb-btn:active{transform:translate(2px,2px);box-shadow:none}
.atb-btn:focus-visible{outline:3px solid #F16B53;outline-offset:2px}
</style>
</helmet>
<header style="width: 100%; box-sizing: border-box; background: #FFFDF5; border-bottom: 3px solid #000; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; font-family: 'Archivo', system-ui, sans-serif; color: #000">
  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto">
    <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; line-height: 14px; font-weight: 700">{{crumb}}</span>
    <h1 style="margin: 0; font-size: 24px; line-height: 26px; font-weight: 900; letter-spacing: -0.04em">{{title}}</h1>
  </div>
  <div role="search" style="position: relative; flex: 0 1 300px; min-width: 180px">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="square" aria-hidden="true" style="position: absolute; left: 10px; top: 11px"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5L20 20"></path></svg>
    <input class="atb-field" type="search" aria-label="Search switches, users and builds" placeholder="Search switches, users, builds" style="width: 100%; padding-left: 32px">
  </div>
  <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase">Range
    <select class="atb-field" aria-label="Date range" style="text-transform: none; letter-spacing: 0; font-weight: 700">
      <option>Last 7 days</option>
      <option selected>Last 30 days</option>
      <option>Last 90 days</option>
      <option>Custom…</option>
    </select>
  </label>
  <button type="button" class="atb-btn" aria-label="Notifications, 3 new">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg>
    <span aria-hidden="true" style="position: absolute; right: -6px; top: -6px; width: 16px; height: 16px; border: 2px solid #000; background: #F16B53; font-family: 'Space Mono', ui-monospace, monospace; font-size: 9px; line-height: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
  </button>
  <button type="button" aria-label="Account menu for [ADMIN NAME]" style="appearance: none; margin: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 0; height: 38px; border: 2px solid #000; background: #FFFFFF; font: inherit; color: #000; box-shadow: 2px 2px 0 #000">
    <span aria-hidden="true" style="width: 34px; height: 34px; background: #99D6FF; border-right: 2px solid #000; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px">AD</span>
    <span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 12px; line-height: 14px; font-weight: 900">[ADMIN NAME]</span><span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 10px; line-height: 12px; font-weight: 700">Admin</span></span>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Overview"},"crumb":{"editor":"text","default":"KeyLab admin"},"$preview":{"width":1208,"height":66}}'>
class Component extends DCLogic {
  renderVals() {
    return { title: this.props.title || 'Overview', crumb: this.props.crumb || 'KeyLab admin' };
  }
}
</script>
</body>
</html>
