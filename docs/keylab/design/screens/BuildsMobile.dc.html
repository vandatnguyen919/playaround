<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeyLab · My builds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;family=Nunito:wght@700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.kl{--bg:#FFFDF5;--surface:#FFFFFF;--surface2:#FFF1C7;--text:#000000;--muted:#3A3A3A;--acc:#FFD24D;--lime:#C6F079;--coral:#F16B53;--sky:#99D6FF;--indigo:#2C2A5A;font-family:'Archivo',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.kl[data-theme="dark"]{--bg:#1E1C3F;--surface:#2C2A5A;--surface2:#3A3870;--text:#FFFDF5;--muted:#D6D3F5}
.kl *{box-sizing:border-box}
.mono{font-family:'Space Mono',ui-monospace,Menlo,monospace}
.kc{appearance:none;margin:0;cursor:pointer;font:inherit;font-size:14px;font-weight:800;color:#000;background:#FFFDF5;border:2.5px solid #000;border-radius:0;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:3px 3px 0 #000;transition:transform 70ms ease,box-shadow 70ms ease;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.kc:hover{background:#FFF1C7}
.kc:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.kc.primary{background:var(--lime);min-height:56px;font-size:16px;font-weight:900;border-width:3px;box-shadow:5px 5px 0 #000}
.kc.primary:active{transform:translate(5px,5px);box-shadow:0 0 0 #000}
.kc.coral{background:var(--coral)}
.kc.sm{padding:0 12px;font-size:13px}
.kc.icon{width:44px;padding:0}
.kc:focus-visible,.nv:focus-visible,.tile:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.tile{appearance:none;margin:0;font:inherit;color:#000;text-align:left;cursor:pointer;background:#FFFFFF;border:3px solid #000;border-radius:0;padding:10px 12px;display:flex;gap:12px;align-items:center;min-height:62px;box-shadow:4px 4px 0 #000;transition:transform 70ms ease,box-shadow 70ms ease}
.tile:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}
.tile[aria-pressed="true"]{background:var(--acc);transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000}
.field{width:100%;min-height:52px;border:3px solid #000;border-radius:0;padding:0 14px;font:inherit;font-size:18px;font-weight:900;letter-spacing:-.02em;color:#000;background:#FFFFFF;box-shadow:4px 4px 0 #000}
.field:focus{outline:none;background:#FFF1C7}
.lbl{font-size:12px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:900;margin:0}
.h1{font-size:36px;line-height:34px;font-weight:900;letter-spacing:-.05em;margin:0}
.nav{flex:none;display:flex;gap:2px;padding:8px 8px 22px;background:#FFFFFF;border-top:3px solid #000}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;flex:1;color:#000;text-decoration:none;font-size:11px;font-weight:800}
.nv .ic{width:46px;height:32px;display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;transition:transform 70ms}
.nv:active .ic{transform:translate(2px,2px)}
.nv.on .ic{background:var(--acc);border-color:#000;box-shadow:3px 3px 0 #000}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="kl" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="flex: none; padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <h1 class="h1">My builds</h1>
    <a class="kc sm" href="Main.dc.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New build
    </a>
  </header>

  <main class="noscroll" style="flex: 1; overflow-y: auto; padding: 4px 16px 28px; display: flex; flex-direction: column; gap: 18px">
    <p role="status" style="margin: 0; padding: 8px 12px; border: 3px solid #000; background: var(--lime); color: #000; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 900">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      {{status}}
    </p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="bname" class="lbl">Build name</label>
      <input id="bname" class="field" type="text" value="{{name}}" onChange="{{rename}}" maxlength="32">
    </div>

    <dc-import name="BuildCard" build="{{card}}" width="352" hint-size="352px,440px"></dc-import>

    <div style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px">
      <button type="button" class="kc primary" onClick="{{openShare}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg>
        Share card
      </button>
      <a class="kc coral" href="PlaygroundMobile.dc.html" style="min-height: 56px">Type on it</a>
    </div>

    <section aria-labelledby="parts-h" style="border: 3px solid #000; background: #FFFFFF; color: #000; box-shadow: 5px 5px 0 #000">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 3px solid #000; background: var(--acc)">
        <h2 id="parts-h" style="margin: 0; font-size: 18px; font-weight: 900; letter-spacing: -0.03em">Parts list</h2>
        <button type="button" class="kc sm" onClick="{{copy}}">{{copyLabel}}</button>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{parts}}" as="r" hint-placeholder-count="7">
          <li style="display: grid; grid-template-columns: 52px minmax(0, 1fr); border-bottom: 2px solid #000">
            <span class="mono" style="padding: 9px 8px; font-size: 12px; font-weight: 700; border-right: 2px solid #000; background: #FFFDF5">{{r.q}}</span>
            <span style="padding: 8px 10px; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 14px; font-weight: 800">{{r.item}}</span>
              <span class="mono" style="font-size: 11px">{{r.note}}</span>
            </span>
          </li>
        </sc-for>
      </ul>
      <p style="margin: 0; padding: 8px 12px; font-size: 12px; font-weight: 700">Prices and shops: [RETAILER LINKS]</p>
    </section>

    <section aria-labelledby="saved-h" style="display: flex; flex-direction: column; gap: 12px">
      <h2 id="saved-h" class="lbl">Saved builds</h2>
      <sc-for list="{{builds}}" as="b" hint-placeholder-count="3">
        <button type="button" class="tile" aria-pressed="{{b.on}}" onClick="{{b.pick}}">
          <span aria-hidden="true" style="flex: none; width: 38px; height: 38px; border: 2.5px solid #000; background: {{b.a}}; display: flex; align-items: flex-end; justify-content: flex-end; padding: 4px"><span style="width: 12px; height: 12px; border: 2px solid #000; background: {{b.stem}}"></span></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 900; letter-spacing: -0.02em">{{b.name}}</span>
            <span class="mono" style="font-size: 11px; font-weight: 700">{{b.spec}}</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      </sc-for>
    </section>
  </main>

  <nav class="nav" aria-label="Primary">
    <a class="nv" href="Main.dc.html"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><rect x="2" y="6" width="20" height="12"></rect><path d="M6 10h1M10 10h1M14 10h1M18 10h1M7 14h10"></path></svg></span>Build</a>
    <a class="nv" href="SwitchesMobile.dc.html"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M12 2.5v7M8.5 6h7"></path><rect x="4.5" y="11" width="15" height="9.5"></rect></svg></span>Switches</a>
    <a class="nv" href="ModsMobile.dc.html"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><rect x="13" y="5" width="4" height="4"></rect><rect x="7" y="15" width="4" height="4"></rect></svg></span>Mods</a>
    <a class="nv" href="KeycapsMobile.dc.html"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3.5 19.5h17L18 6H6z"></path><path d="M9 10.5h6"></path></svg></span>Keycaps</a>
    <a class="nv on" href="BuildsMobile.dc.html" aria-current="page"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"></path></svg></span>My builds</a>
    <a class="nv" href="ProfileMobile.dc.html"><span class="ic"><span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border: 2.5px solid #000; background: #FFD24D; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; letter-spacing: -0.03em">TW</span></span>Profile</a>
  </nav>

  <sc-if value="{{share}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Share build" style="position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; flex-direction: column; justify-content: flex-end">
      <button type="button" aria-label="Close share sheet" onClick="{{closeShare}}" style="flex: 1; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer"></button>
      <div style="background: var(--bg); border-top: 3px solid #000; padding: 16px 16px 30px; display: flex; flex-direction: column; align-items: center; gap: 16px">
        <div style="width: 100%; display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.04em">Share build card</h2>
          <button type="button" class="kc icon" aria-label="Close" onClick="{{closeShare}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
        <dc-import name="BuildCard" build="{{card}}" variant="share" width="296" hint-size="296px,385px"></dc-import>
        <div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
          <button type="button" class="kc primary">Save image</button>
          <button type="button" class="kc" style="min-height: 56px" onClick="{{copyLink}}">{{linkLabel}}</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"share":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const BUILDS = [
  { name: 'Night Thock 65', layout: '65', layoutLabel: '65%', keys: 68, sw: 'Milk Yellow', stem: '#E9C46A', swType: 'Linear · 50g', mods: ['Light lube', 'Case foam', 'Tuned stabs'], caps: 'PBT · Cherry · Navy Mustard', capsShort: 'Navy Mustard', case: 'Aluminum · gasket · brass', caseShort: 'Alu, gasket', caseFull: '65% aluminum case', mount: 'Gasket mount', plateFull: 'Brass plate', a: '#3D6A8C', m: '#1F2B45', x: '#F2C14E', c: '#2B4677', profile: 'cherry', plate: 'brass', stabs: '3× 2u · 1× 6.25u', snd: { pitch: 470, bright: .2, decay: 62, thump: 1, vol: .7 } },
  { name: 'Studio TKL', layout: 'tkl', layoutLabel: 'TKL', keys: 87, sw: 'Bump Brown', stem: '#7A4E2D', swType: 'Tactile · 55g', mods: ['Case foam', 'O-rings'], caps: 'PBT · OEM · Cream & Ink', capsShort: 'Cream & Ink', case: 'Polycarbonate · tray · FR4', caseShort: 'PC, tray', caseFull: 'TKL polycarbonate case', mount: 'Tray mount', plateFull: 'FR4 plate', a: '#ECE6D8', m: '#2A2E38', x: '#D9573B', c: '#DCE3EC', profile: 'oem', plate: 'fr4', stabs: '4× 2u · 1× 6.25u', snd: { pitch: 600, bright: .26, decay: 44, thump: .7, vol: .45 } },
  { name: 'Quiet 75', layout: '75', layoutLabel: '75%', keys: 84, sw: 'Hush Red', stem: '#E07A7A', swType: 'Silent · 45g', mods: ['Heavy lube', 'Case foam'], caps: 'PBT · XDA · Mono Slate', capsShort: 'Mono Slate', case: 'Plastic · top mount · POM', caseShort: 'Plastic, top', caseFull: '75% plastic case', mount: 'Top mount', plateFull: 'POM plate', a: '#3B4458', m: '#2A3142', x: '#9AA7BD', c: '#5B657A', profile: 'xda', plate: 'pom', stabs: '3× 2u · 1× 6.25u', snd: { pitch: 330, bright: .05, decay: 26, thump: .4, vol: .24 } }
];

class Component extends DCLogic {
  state = { sel: 0, names: BUILDS.map((b) => b.name), share: null, copied: false, linked: false };
  componentWillUnmount() { clearTimeout(this.tm); }
  flag(k) { const u = {}; u[k] = true; this.setState(u); clearTimeout(this.tm); this.tm = setTimeout(() => { const v = {}; v[k] = false; this.setState(v); }, 1600); }

  renderVals() {
    const s = this.state, p = this.props;
    const b = BUILDS[s.sel];
    const name = s.names[s.sel];
    const card = Object.assign({}, b, { name: name || 'Untitled build' });
    const share = s.share == null ? !!p.share : s.share;
    const parts = [
      { q: '1×', item: b.caseFull, note: b.mount },
      { q: '1×', item: b.plateFull, note: b.layoutLabel + ' layout' },
      { q: '1×', item: b.layoutLabel + ' hot-swap PCB', note: 'Needed for any build' },
      { q: (b.keys + 4) + '×', item: b.sw + ' switches', note: b.keys + ' keys + 4 spares' },
      { q: '1 set', item: 'Keycaps · ' + b.capsShort, note: b.caps },
      { q: '1 set', item: 'Stabilizers', note: b.stabs }
    ].concat(b.mods.map((m) => ({ q: '1×', item: m, note: 'Mod' })));
    return {
      theme: p.theme || 'light',
      status: (name || 'Build') + ' saved',
      name: name,
      rename: (e) => { const n = s.names.slice(); n[s.sel] = e.target.value; this.setState({ names: n }); },
      card: card,
      parts: parts,
      copyLabel: s.copied ? 'Copied' : 'Copy list',
      copy: () => { try { navigator.clipboard.writeText(parts.map((r) => r.q + ' ' + r.item + ' (' + r.note + ')').join('\n')); } catch (e) {} this.flag('copied'); },
      share: share,
      openShare: () => this.setState({ share: true }),
      closeShare: () => this.setState({ share: false }),
      linkLabel: s.linked ? 'Link copied' : 'Copy link',
      copyLink: () => this.flag('linked'),
      builds: BUILDS.map((x, i) => ({ name: s.names[i] || 'Untitled build', a: x.a, stem: x.stem, spec: (x.layoutLabel + ' · ' + x.sw + ' · ' + x.mods.length + ' mods').toUpperCase(), on: String(i === s.sel), pick: () => this.setState({ sel: i }) }))
    };
  }
}
</script>
</body>
</html>
