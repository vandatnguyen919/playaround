<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeyLab · Onboarding (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.kl{--acc:#FFD24D;--lime:#C6F079;--coral:#F16B53;--sky:#99D6FF;font-family:'Archivo',system-ui,-apple-system,sans-serif;color:#000;background:#FFF1C7;-webkit-font-smoothing:antialiased}
.kl *{box-sizing:border-box}
.mono{font-family:'Space Mono',ui-monospace,Menlo,monospace}
.kc{appearance:none;margin:0;cursor:pointer;font:inherit;font-size:15px;font-weight:800;color:#000;background:#FFFDF5;border:2.5px solid #000;border-radius:0;min-height:48px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:3px 3px 0 #000;transition:transform 70ms ease,box-shadow 70ms ease;white-space:nowrap}
.kc:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.kc[aria-checked="true"]{background:var(--acc)}
.kc.primary{background:var(--lime);min-height:56px;font-size:17px;font-weight:900;border-width:3px;box-shadow:5px 5px 0 #000}
.kc.primary:active{transform:translate(5px,5px);box-shadow:0 0 0 #000}
.kc.primary[aria-disabled="true"]{background:#E6E1D3;color:#3A3A3A;box-shadow:none}
.kc.icon{width:44px;padding:0}
.kc:focus-visible,.opt:focus-visible,.lnk:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.lbl{margin:0;font-size:12px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.opt{appearance:none;margin:0;cursor:pointer;font:inherit;text-align:left;color:#000;background:#FFFFFF;border:3px solid #000;border-radius:0;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:4px 4px 0 #000;min-height:64px}
.opt:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}
.opt[aria-checked="true"]{background:var(--acc)}
.lnk{font-weight:800;text-decoration:underline;text-underline-offset:3px}
</style>
</helmet>
<div class="kl" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex: none; border-bottom: 3px solid #000; background: #FFFDF5; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between">
    <span class="lbl">Step {{stepNo}} of 3</span>
    <a class="lnk" href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px">Skip</a>
  </header>
  <ol aria-label="Progress" style="flex: none; list-style: none; margin: 0; padding: 12px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{progress}}" as="p" hint-placeholder-count="3"><li aria-current="{{p.cur}}" style="height: 12px; border: 2.5px solid #000; background: {{p.bg}}"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{p.label}}</span></li></sc-for>
  </ol>
  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 18px; display: flex; flex-direction: column; gap: 14px">
    <sc-if value="{{s1}}" hint-placeholder-val="{{ true }}">
      <h1 id="mq1" style="margin: 0; font-size: 34px; line-height: 34px; font-weight: 900; letter-spacing: -0.05em">HOW MUCH HAVE YOU BUILT BEFORE?</h1>
      <div role="radiogroup" aria-labelledby="mq1" style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{levels}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" class="opt" aria-checked="{{o.on}}" onClick="{{o.pick}}"><span style="font-size: 19px; font-weight: 900; letter-spacing: -0.03em">{{o.title}}</span><span style="font-size: 14px; line-height: 19px; font-weight: 500">{{o.desc}}</span></button></sc-for>
      </div>
    </sc-if>
    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <h1 id="mq2" style="margin: 0; font-size: 34px; line-height: 34px; font-weight: 900; letter-spacing: -0.05em">WHICH SOUND DO YOU LIKE?</h1>
      <div role="radiogroup" aria-labelledby="mq2" style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{sounds}}" as="o" hint-placeholder-count="4">
          <div style="position: relative; display: flex">
            <button type="button" role="radio" class="opt" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="flex: 1; padding-right: 64px"><span style="font-size: 19px; font-weight: 900">{{o.name}} <span class="mono" style="font-size: 10px">{{o.like}}</span></span><span style="width: 100%; border: 2px solid #000; background: #FFFDF5; padding: 3px 4px"><dc-import name="Waveform" profile="{{o.name}}" height="26" labels="{{ false }}" seed="{{o.seed}}" hint-size="100%,26px"></dc-import></span></button>
            <button type="button" class="kc icon" aria-label="{{o.playLabel}}" onClick="{{o.play}}" style="position: absolute; right: 12px; top: 12px; background: var(--coral)"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4v16l14-8z"></path></svg></button>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
      <h1 id="mq3" style="margin: 0; font-size: 34px; line-height: 34px; font-weight: 900; letter-spacing: -0.05em">PICK A STARTING LAYOUT.</h1>
      <div role="radiogroup" aria-labelledby="mq3" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{layouts}}" as="o" hint-placeholder-count="5"><button type="button" role="radio" class="kc" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="flex-direction: column; gap: 0; min-height: 60px; padding: 0"><span style="font-size: 18px; font-weight: 900">{{o.label}}</span><span class="mono" style="font-size: 10px; font-weight: 700">{{o.keys}} KEYS</span></button></sc-for>
      </div>
      <div style="border: 3px solid #000; background: var(--sky); box-shadow: 5px 5px 0 #000; padding: 14px 8px; display: flex; justify-content: center"><dc-import name="Keyboard" layout="{{layout}}" width="330" sound="{{snd}}" hint-size="330px,150px"></dc-import></div>
    </sc-if>
  </main>
  <footer style="flex: none; border-top: 3px solid #000; background: #FFFDF5; padding: 12px 16px 24px; display: flex; gap: 10px">
    <sc-if value="{{canBack}}" hint-placeholder-val="{{ false }}"><button type="button" class="kc" onClick="{{back}}" aria-label="Back">←</button></sc-if>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}"><button type="button" class="kc primary" aria-disabled="{{nextDisabled}}" onClick="{{next}}" style="flex: 1">Continue →</button></sc-if>
    <sc-if value="{{last}}" hint-placeholder-val="{{ false }}"><a class="kc primary" href="Main.dc.html" style="flex: 1">Open my build →</a></sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["1","2","3"],"default":"1"},"$preview":{"width":390,"height":844}}'>
const LEVELS = [
  { id: 'new', title: 'New to this', desc: 'Explain switches, mods and layouts as I go.' },
  { id: 'some', title: 'Built one before', desc: 'I know the basics. Show me the specs.' },
  { id: 'lots', title: 'I build a lot', desc: 'Skip the tips. Give me force curves.' }
];
const SOUNDS = [
  { name: 'Deep', like: 'THOCK', seed: 3, snd: { pitch: 470, bright: .2, decay: 66, thump: 1, vol: .7 } },
  { name: 'Poppy', like: 'POP', seed: 11, snd: { pitch: 1000, bright: .5, decay: 56, thump: .7, vol: .74 } },
  { name: 'Clacky', like: 'CLACK', seed: 19, snd: { pitch: 1450, bright: .7, decay: 42, thump: .35, vol: .66 } },
  { name: 'Muted', like: 'HUSH', seed: 27, snd: { pitch: 380, bright: .08, decay: 34, thump: .4, vol: .3 } }
];
const LAYOUTS = [['60', '60%', 61], ['65', '65%', 68], ['75', '75%', 84], ['tkl', 'TKL', 87], ['100', '100%', 104]];
class Component extends DCLogic {
  state = { step: null, level: null, sound: null, layout: '65' };
  play(s) {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }
      const ctx = this.ctx; if (ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime + .01, n = Math.floor(ctx.sampleRate * .08), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = s.pitch; bp.Q.value = .8 + s.bright * 3;
      const g = ctx.createGain(); g.gain.setValueAtTime(s.vol * .8, t); g.gain.exponentialRampToValueAtTime(.0008, t + s.decay / 1000);
      src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t);
    } catch (e) {}
  }
  renderVals() {
    const s = this.state, step = s.step || Number(this.props.step || 1);
    const picked = [s.level, s.sound, s.layout][step - 1];
    const names = ['Experience', 'Sound', 'Layout'];
    return {
      stepNo: step,
      progress: names.map((n, i) => ({ label: n, cur: i + 1 === step ? 'step' : 'false', bg: i + 1 < step ? '#000' : i + 1 === step ? '#FFD24D' : '#FFFFFF' })),
      s1: step === 1, s2: step === 2, s3: step === 3,
      levels: LEVELS.map((o) => ({ title: o.title, desc: o.desc, on: String(s.level === o.id), pick: () => this.setState({ level: o.id }) })),
      sounds: SOUNDS.map((o) => ({ name: o.name, like: o.like, seed: o.seed, on: String(s.sound === o.name), playLabel: 'Play ' + o.name.toLowerCase() + ' sound', play: () => this.play(o.snd), pick: () => { this.setState({ sound: o.name }); this.play(o.snd); } })),
      layouts: LAYOUTS.map((l) => ({ label: l[1], keys: l[2], on: String(s.layout === l[0]), pick: () => this.setState({ layout: l[0] }) })),
      layout: s.layout, snd: (SOUNDS.find((x) => x.name === s.sound) || SOUNDS[0]).snd,
      canBack: step > 1, notLast: step < 3, last: step === 3, nextDisabled: String(!picked),
      back: () => this.setState({ step: step - 1 }), next: () => { if (picked) this.setState({ step: step + 1 }); }
    };
  }
}
</script>
</body>
</html>
