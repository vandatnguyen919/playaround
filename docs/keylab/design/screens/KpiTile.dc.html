<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KPI tile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.kpi-retry{appearance:none;margin:0;cursor:pointer;font:inherit;font-size:12px;font-weight:800;color:#000;background:#FFFDF5;border:2px solid #000;border-radius:0;min-height:32px;padding:0 10px;box-shadow:2px 2px 0 #000}
.kpi-retry:active{transform:translate(2px,2px);box-shadow:none}
.kpi-retry:focus-visible{outline:3px solid #F16B53;outline-offset:2px}
@keyframes kpiPulse{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</helmet>
<section aria-label="{{label}}" aria-busy="{{busy}}" style="width: 100%; height: 132px; box-sizing: border-box; border: 2.5px solid #000; background: #FFFDF5; color: #000; box-shadow: 4px 4px 0 #000; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-family: 'Archivo', system-ui, sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <h3 style="margin: 0; font-size: 11px; line-height: 14px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase">{{label}}</h3>
    <span aria-hidden="true" style="width: 10px; height: 10px; border: 2px solid #000; background: {{accent}}"></span>
  </div>
  <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex: 1">
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 24px; line-height: 28px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{value}}</span>
        <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border: 2px solid #000; background: {{deltaBg}}; font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; line-height: 15px; font-weight: 700">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="{{arrow}}" fill="#000"></path></svg>{{delta}}
        </span>
      </div>
      <svg width="110" height="44" viewBox="0 0 110 44" role="img" aria-label="Trend sparkline, sample shape" style="flex: none">
        <path d="{{area}}" fill="{{accent}}" fill-opacity=".35"></path>
        <polyline points="{{pts}}" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="miter"></polyline>
        <rect x="{{lastX}}" y="{{lastY}}" width="7" height="7" fill="{{accent}}" stroke="#000" stroke-width="2"></rect>
      </svg>
    </div>
    <span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #3A3A3A">vs last period</span>
  </sc-if>
  <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; animation: kpiPulse 1.2s ease-in-out infinite">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="width: 120px; height: 22px; background: #000"></span>
        <span style="width: 70px; height: 14px; background: #C9C4B4"></span>
      </div>
      <span style="width: 110px; height: 40px; border: 2px dashed #000; background: repeating-linear-gradient(45deg, #FFF1C7 0 6px, #FFFDF5 6px 12px)"></span>
    </div>
    <span style="font-size: 11px; font-weight: 800">Loading…</span>
  </sc-if>
  <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px">
      <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 24px; line-height: 28px; font-weight: 700">—</span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 600">No data in this date range yet.</span>
    </div>
  </sc-if>
  <sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="flex: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; border-left: 5px solid #F16B53; padding-left: 8px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 700">Couldn’t load this number.</span>
      <button type="button" class="kpi-retry" onClick="{{retry}}">Retry</button>
    </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Active users"},"value":{"editor":"text","default":"[ACTIVE USERS]"},"delta":{"editor":"text","default":"[+X%]"},"up":{"editor":"boolean","default":true},"accent":{"editor":"color","options":["#C6F079","#99D6FF","#FFD24D","#F16B53"],"default":"#C6F079"},"state":{"editor":"enum","options":["ready","loading","empty","error"],"default":"ready"},"points":{"editor":null},"onRetry":{"editor":null},"$preview":{"width":280,"height":136}}'>
const KPI_SAMPLE = [6, 7, 6.5, 8, 7.5, 9, 8.5, 10, 9.5, 11, 12, 11.5];
class Component extends DCLogic {
  state = { st: null };
  renderVals() {
    const p = this.props;
    const st = this.state.st || p.state || 'ready';
    const pts = (p.points && p.points.length > 1) ? p.points : KPI_SAMPLE;
    const lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts), rng = (hi - lo) || 1;
    const xy = pts.map((v, i) => [3 + i * (100 / (pts.length - 1)), 40 - ((v - lo) / rng) * 34]);
    const up = p.up !== false;
    return {
      label: p.label || 'Active users', value: p.value || '[ACTIVE USERS]', delta: p.delta || '[+X%]',
      accent: p.accent || '#C6F079',
      deltaBg: up ? '#C6F079' : '#F16B53', arrow: up ? 'M5 1 L9 8 L1 8 Z' : 'M5 9 L9 2 L1 2 Z',
      pts: xy.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' '),
      area: 'M' + xy.map((q) => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L') + ' L103 42 L3 42 Z',
      lastX: (xy[xy.length - 1][0] - 3.5).toFixed(1), lastY: (xy[xy.length - 1][1] - 3.5).toFixed(1),
      ready: st === 'ready', loading: st === 'loading', empty: st === 'empty', error: st === 'error',
      busy: String(st === 'loading'),
      retry: () => { if (p.onRetry) p.onRetry(); this.setState({ st: 'loading' }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ st: 'ready' }), 900); }
    };
  }
  componentWillUnmount() { clearTimeout(this.t); }
}
</script>
</body>
</html>
