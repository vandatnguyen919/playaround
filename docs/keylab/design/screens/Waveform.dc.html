<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound waveform</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: 4px; font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; color: inherit">
  <svg width="100%" height="{{H}}" viewBox="0 0 {{W}} {{H}}" preserveAspectRatio="none" role="img" aria-label="{{aria}}" style="display: block">
    <line x1="0" y1="{{mid}}" x2="{{W}}" y2="{{mid}}" stroke="#000" stroke-width="2"></line>
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="72">
      <rect x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" rx="{{b.r}}" fill="{{b.c}}"></rect>
    </sc-for>
  </svg>
  <sc-if value="{{labels}}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; height: 14px; font-size: 10px; line-height: 14px">
      <span style="position: absolute; left: 12%">press</span>
      <span style="position: absolute; left: 58%">release</span>
      <span style="position: absolute; right: 0">{{dur}}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"profile":{"editor":"enum","options":["Deep","Poppy","Clacky","Muted"],"default":"Deep"},"color":{"editor":"color","default":"#2C2A5A"},"seed":{"editor":"int","min":1,"max":999,"default":7},"height":{"editor":"int","min":32,"max":200,"default":76},"labels":{"editor":"boolean","default":true},"$preview":{"width":340,"height":96}}'>
const WF = {
  Deep: { dp: .085, dr: .06, amp: .78, jit: .25, dur: '320 ms' },
  Poppy: { dp: .05, dr: .045, amp: .92, jit: .35, dur: '260 ms' },
  Clacky: { dp: .03, dr: .03, amp: 1, jit: .5, dur: '210 ms' },
  Muted: { dp: .035, dr: .03, amp: .42, jit: .2, dur: '180 ms' }
};
function wfRand(seed) {
  let a = seed >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function wfBurst(t, c, d) { return t < c ? Math.exp(-Math.pow((c - t) / .012, 2)) : Math.exp(-(t - c) / d); }

class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const prof = WF[p.profile] || WF.Deep;
    const W = 340, H = p.height || 76, N = 72, mid = H / 2;
    const rnd = wfRand(p.seed || 7);
    const col = p.color || '#2C2A5A';
    const bars = [];
    for (let i = 0; i < N; i++) {
      const t = i / N;
      const e = Math.max(wfBurst(t, .14, prof.dp), .55 * wfBurst(t, .6, prof.dr));
      const a = Math.min(1, (.035 + e * prof.amp) * (1 - prof.jit / 2 + rnd() * prof.jit));
      const h = Math.max(2, a * (H - 4));
      const bw = W / N * .56;
      bars.push({ x: (i * W / N + (W / N - bw) / 2).toFixed(1), y: (mid - h / 2).toFixed(1), w: bw.toFixed(1), h: h.toFixed(1), r: 0, c: t > .5 ? '#F16B53' : col });
    }
    return { W: W, H: H, mid: mid, bars: bars, labels: p.labels !== false, dur: prof.dur, aria: (p.profile || 'Deep') + ' sound profile waveform with press and release peaks' };
  }
}
</script>
</body>
</html>
