<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data table row</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.dtr-chk{width:18px;height:18px;margin:0;accent-color:#000}
.dtr-chk:focus-visible{outline:3px solid #F16B53;outline-offset:2px}
@keyframes dtrPulse{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; font-family: 'Archivo', system-ui, sans-serif; color: #000; border: 2px solid #000; background: {{bg}}; outline: {{outline}}; outline-offset: -5px; display: grid; grid-template-columns: 40px 52px minmax(0, 1.4fr) minmax(0, 1fr) 96px 72px 72px 120px 84px; align-items: center; min-height: 52px; font-size: 13px">
  <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
    <span style="display: flex; justify-content: center"><input class="dtr-chk" type="checkbox" checked="{{checked}}" aria-label="Select Milk Yellow"></span>
    <span aria-hidden="true" style="width: 36px; height: 36px; border: 2px solid #000; background: #FFFDF5; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; border: 2px solid #000; background: #E9C46A"></span></span>
    <span style="font-weight: 900; font-size: 14px">Milk Yellow</span>
    <span style="font-weight: 600">KeyLab Lab</span>
    <span><span style="padding: 1px 6px; border: 2px solid #000; background: #2C2A5A; color: #FFFFFF; font-size: 10px; line-height: 14px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase">Linear</span></span>
    <span style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700">50g</span>
    <span style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700">4.0mm</span>
    <span><dc-import name="StatusBadge" status="recorded" hint-size="96px,22px"></dc-import></span>
    <span style="display: flex; justify-content: center"><span aria-hidden="true" style="position: relative; width: 44px; height: 24px; border: 2px solid #000; background: #000"><span style="position: absolute; top: 3px; left: 23px; width: 14px; height: 14px; border: 2px solid #000; background: #FFD24D"></span></span></span>
  </sc-if>
  <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
    <span></span>
    <span style="width: 36px; height: 36px; border: 2px dashed #000; animation: dtrPulse 1.2s ease-in-out infinite"></span>
    <span style="height: 12px; width: 70%; background: #000; animation: dtrPulse 1.2s ease-in-out infinite"></span>
    <span style="height: 10px; width: 60%; background: #C9C4B4"></span>
    <span style="height: 14px; width: 56px; background: #C9C4B4"></span>
    <span style="height: 10px; width: 36px; background: #C9C4B4"></span>
    <span style="height: 10px; width: 40px; background: #C9C4B4"></span>
    <span style="height: 16px; width: 80px; background: #C9C4B4"></span>
    <span></span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","hover","selected","focus","loading"],"default":"default"},"$preview":{"width":1000,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state || 'default';
    return {
      ready: s !== 'loading', loading: s === 'loading', checked: s === 'selected',
      bg: s === 'selected' ? '#FFD24D' : s === 'hover' ? '#FFF1C7' : '#FFFDF5',
      outline: s === 'focus' ? '3px solid #F16B53' : 'none'
    };
  }
}
</script>
</body>
</html>
