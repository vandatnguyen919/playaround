<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeyLab · Pricing (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.kl{--acc:#FFD24D;--lime:#C6F079;--coral:#F16B53;--sky:#99D6FF;--sun:#FFF1C7;font-family:'Archivo',system-ui,-apple-system,sans-serif;color:#000;background:#FFFDF5;-webkit-font-smoothing:antialiased}
.kl *{box-sizing:border-box}
.mono{font-family:'Space Mono',ui-monospace,Menlo,monospace}
.wrap{padding:0 16px}
.kc{appearance:none;margin:0;cursor:pointer;font:inherit;font-size:14px;font-weight:800;color:#000;background:#FFFDF5;border:2.5px solid #000;border-radius:0;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:3px 3px 0 #000;transition:transform 70ms ease,box-shadow 70ms ease;white-space:nowrap}
.kc:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.kc[aria-checked="true"]{background:var(--acc)}
.kc.primary{background:var(--lime);min-height:56px;font-size:17px;font-weight:900;border-width:3px;box-shadow:5px 5px 0 #000}
.kc.primary:active{transform:translate(5px,5px);box-shadow:0 0 0 #000}
.kc:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.sticker{display:inline-flex;align-items:center;padding:3px 8px;border:2.5px solid #000;background:var(--acc);font-size:11px;line-height:15px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.h1{margin:0;font-size:42px;line-height:40px;font-weight:900;letter-spacing:-.06em}
.h2{margin:0;font-size:30px;line-height:30px;font-weight:900;letter-spacing:-.05em}
.body{margin:0;font-size:16px;line-height:24px;font-weight:500}
.cmp{width:100%;border-collapse:collapse;border:3px solid #000;background:#FFFFFF;box-shadow:5px 5px 0 #000}
.cmp th,.cmp td{border:2px solid #000;padding:10px 8px;text-align:left;font-size:13px;line-height:17px}
.cmp thead th{background:#FFFDF5;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.cmp tbody th{font-weight:800}
.cmp td{font-weight:600}
.cmp .pro{background:#FFF1C7}
</style>
</helmet>
<div class="kl" style="width: 390px">
  <dc-import name="MktNav" mobile="{{ true }}" active="pricing" hint-size="390px,70px"></dc-import>
  <main>
    <section aria-labelledby="pr-h" style="border-bottom: 3px solid #000">
      <div class="wrap" style="padding-top: 28px; padding-bottom: 44px; display: flex; flex-direction: column; gap: 20px">
        <span class="sticker" style="align-self: flex-start; background: var(--sky)">Pricing</span>
        <h1 id="pr-h" class="h1">BUILD FREE. GO PRO WHEN IT GETS SERIOUS.</h1>
        <p class="body">Every feature you need to hear a build is free.</p>
        <div role="radiogroup" aria-label="Billing" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button type="button" role="radio" class="kc" aria-checked="{{monthlyOn}}" onClick="{{setMonthly}}">Monthly</button>
          <button type="button" role="radio" class="kc" aria-checked="{{yearlyOn}}" onClick="{{setYearly}}">Yearly <span class="mono" style="font-size: 9px; padding: 0 4px; border: 2px solid #000; background: var(--lime)">[SAVE X%]</span></button>
        </div>
        <dc-import name="PricingCard" tier="pro" yearly="{{yearly}}" href="MktAuthMobile.dc.html" hint-size="100%,520px"></dc-import>
        <dc-import name="PricingCard" tier="free" yearly="{{yearly}}" href="MktAuthMobile.dc.html" hint-size="100%,500px"></dc-import>
      </div>
    </section>
    <section aria-labelledby="cmp-h" style="border-bottom: 3px solid #000; background: var(--sun)">
      <div class="wrap" style="padding-top: 44px; padding-bottom: 52px; display: flex; flex-direction: column; gap: 16px">
        <h2 id="cmp-h" class="h2">COMPARE THE PLANS</h2>
        <table class="cmp">
          <caption style="text-align: left; padding-bottom: 10px; font-size: 13px; font-weight: 600">Billed {{billWord}}. Amounts are placeholders.</caption>
          <thead><tr><th scope="col">Feature</th><th scope="col">Free</th><th scope="col" class="pro">Pro</th></tr></thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
              <tr><th scope="row">{{r.f}}</th><td>{{r.free}}</td><td class="pro">{{r.pro}}</td></tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </section>
    <section aria-labelledby="cta-h" style="background: var(--acc); border-bottom: 3px solid #000">
      <div class="wrap" style="padding-top: 40px; padding-bottom: 40px; display: flex; flex-direction: column; gap: 16px">
        <h2 id="cta-h" class="h2">NOT SURE YET? PRESS A KEY FIRST.</h2>
        <a class="kc primary" href="MktLandingMobile.dc.html">Try it free</a>
      </div>
    </section>
  </main>
  <dc-import name="MktFooter" mobile="{{ true }}" hint-size="390px,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2900}}'>
const ROWS = [
  ['Saved builds', '3', 'Unlimited'],
  ['Switch library', 'Core', 'Full'],
  ['Mods workshop', 'Yes', 'Yes'],
  ['Keycaps studio', 'Yes', 'Yes'],
  ['Case & plate', 'Yes', 'Yes'],
  ['Sound playground', 'Yes', 'Yes'],
  ['Share links', 'Yes', 'Yes'],
  ['Export parts list', 'No', 'Yes'],
  ['Sound quality', 'Standard', 'HD']
];
class Component extends DCLogic {
  state = { yearly: false };
  renderVals() {
    const y = this.state.yearly;
    return {
      yearly: y, monthlyOn: String(!y), yearlyOn: String(y), billWord: y ? 'yearly' : 'monthly',
      setMonthly: () => this.setState({ yearly: false }), setYearly: () => this.setState({ yearly: true }),
      rows: ROWS.map((r) => ({ f: r[0], free: r[1], pro: r[2] }))
    };
  }
}
</script>
</body>
</html>
