<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeyLab · Switch library (public, mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.kl{--acc:#FFD24D;--lime:#C6F079;--coral:#F16B53;--sky:#99D6FF;--sun:#FFF1C7;font-family:'Archivo',system-ui,-apple-system,sans-serif;color:#000;background:#FFFDF5;-webkit-font-smoothing:antialiased}
.kl *{box-sizing:border-box}
.mono{font-family:'Space Mono',ui-monospace,Menlo,monospace}
.wrap{padding:0 16px}
.kc{appearance:none;margin:0;cursor:pointer;font:inherit;font-size:14px;font-weight:800;color:#000;background:#FFFDF5;border:2.5px solid #000;border-radius:0;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:3px 3px 0 #000;transition:transform 70ms ease,box-shadow 70ms ease;white-space:nowrap}
.kc:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.kc[aria-pressed="true"]{background:var(--acc)}
.kc.primary{background:var(--lime);min-height:56px;font-size:17px;font-weight:900;border-width:3px;box-shadow:5px 5px 0 #000}
.kc.sm{padding:0 12px;font-size:13px}
.kc:focus-visible,.dl:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.lbl{margin:0;font-size:12px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.sticker{display:inline-flex;align-items:center;padding:3px 8px;border:2.5px solid #000;background:var(--acc);font-size:11px;line-height:15px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.h1{margin:0;font-size:38px;line-height:36px;font-weight:900;letter-spacing:-.055em}
.h2{margin:0;font-size:26px;line-height:28px;font-weight:900;letter-spacing:-.045em}
.field{height:46px;border:2.5px solid #000;border-radius:0;background:#FFFFFF;font:inherit;font-size:16px;font-weight:600;padding:0 12px 0 40px;width:100%}
.field:focus{outline:3px solid var(--coral);outline-offset:1px}
.rail{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{flex:none}
.dl{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 10px;border:2.5px solid #000;border-top:0;background:#FFFDF5;font-size:13px;font-weight:900;text-decoration:none}
</style>
</helmet>
<div class="kl" style="width: 390px">
  <dc-import name="MktNav" mobile="{{ true }}" active="switches" hint-size="390px,70px"></dc-import>
  <main>
    <section aria-labelledby="lib-h" style="border-bottom: 3px solid #000; background: var(--sun)">
      <div class="wrap" style="padding-top: 24px; padding-bottom: 28px; display: flex; flex-direction: column; gap: 12px">
        <h1 id="lib-h" class="h1">KEYBOARD SWITCHES, BY SOUND</h1>
        <p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 500">Tap any card to hear its press and release.</p>
      </div>
    </section>
    <section aria-label="Filters" style="border-bottom: 3px solid #000">
      <div class="wrap" style="padding-top: 16px; padding-bottom: 14px; display: flex; flex-direction: column; gap: 10px">
        <label for="libm-q" class="lbl">Search</label>
        <div style="position: relative"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="square" aria-hidden="true" style="position: absolute; left: 13px; top: 15px"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5L20 20"></path></svg><input id="libm-q" class="field" type="search" placeholder="Name or brand" value="{{q}}" onChange="{{setQ}}"></div>
        <div class="rail" role="group" aria-label="Type"><sc-for list="{{types}}" as="t" hint-placeholder-count="5"><button type="button" class="kc sm" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div>
      </div>
    </section>
    <section aria-labelledby="res-h">
      <div class="wrap" style="padding-top: 20px; padding-bottom: 44px; display: flex; flex-direction: column; gap: 16px">
        <h2 id="res-h" class="h2" aria-live="polite">{{countLabel}}</h2>
        <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px">
          <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
            <li style="position: relative; display: flex; flex-direction: column">
              <dc-import name="SwitchCard" sw="{{c.sw}}" hint-size="100%,236px"></dc-import>
              <a class="dl" href="MktSwitchMobile.dc.html" aria-label="{{c.detailLabel}}">Details<span aria-hidden="true">→</span></a>
              <sc-if value="{{c.isNew}}" hint-placeholder-val="{{ false }}"><span class="sticker" style="position: absolute; right: -4px; top: -10px; background: var(--lime); transform: rotate(4deg)">New</span></sc-if>
            </li>
          </sc-for>
        </ul>
        <a class="kc primary" href="MktAuthMobile.dc.html" style="margin-top: 8px">Put one in a build</a>
      </div>
    </section>
  </main>
  <dc-import name="MktFooter" mobile="{{ true }}" hint-size="390px,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2700}}'>
const SW = [
  { id: 'coralpop', name: 'Coral Pop', type: 'Tactile', stem: '#F16B53', housing: 'milky', force: 62, act: 2.0, total: 3.8, prof: 'Poppy', isNew: true, snd: { pitch: 980, bright: .5, decay: 56, thump: .7, vol: .72 } },
  { id: 'milk', name: 'Milk Yellow', type: 'Linear', stem: '#E9C46A', housing: 'milky', force: 50, act: 2.0, total: 4.0, prof: 'Deep', snd: { pitch: 520, bright: .25, decay: 70, thump: .9, vol: .7 } },
  { id: 'red', name: 'Classic Red', type: 'Linear', stem: '#D64545', housing: 'clear', box: true, force: 45, act: 2.0, total: 4.0, prof: 'Poppy', snd: { pitch: 880, bright: .45, decay: 55, thump: .55, vol: .65 } },
  { id: 'ink', name: 'Ink Black', type: 'Linear', stem: '#2A2E38', housing: 'smoke', force: 60, act: 2.0, total: 4.0, prof: 'Deep', snd: { pitch: 430, bright: .18, decay: 82, thump: 1, vol: .72 } },
  { id: 'brown', name: 'Bump Brown', type: 'Tactile', stem: '#7A4E2D', housing: 'amber', force: 55, act: 2.0, total: 4.0, prof: 'Muted', snd: { pitch: 640, bright: .3, decay: 58, thump: .6, vol: .55 } },
  { id: 'blue', name: 'Click Blue', type: 'Clicky', stem: '#2F6FD6', housing: 'ice', box: true, force: 60, act: 2.2, total: 4.0, prof: 'Clacky', snd: { pitch: 1300, bright: .65, decay: 50, thump: .4, vol: .7, click: true } },
  { id: 'hushr', name: 'Hush Red', type: 'Silent', stem: '#E07A7A', housing: 'smoke', force: 45, act: 1.9, total: 3.7, prof: 'Muted', snd: { pitch: 380, bright: .08, decay: 34, thump: .4, vol: .28 } },
  { id: 'proto', name: 'Proto Orange', type: 'Tactile', stem: '#E58A3A', housing: 'clear', force: 58, act: 2.0, total: 3.8, prof: 'Poppy', snd: { none: true }, nosound: true }
];
class Component extends DCLogic {
  state = { q: '', type: 'All' };
  renderVals() {
    const s = this.state, q = s.q.trim().toLowerCase();
    const list = SW.filter((x) => (s.type === 'All' || x.type === s.type) && (!q || x.name.toLowerCase().indexOf(q) >= 0));
    return {
      q: s.q, setQ: (e) => this.setState({ q: e.target.value }),
      types: ['All', 'Linear', 'Tactile', 'Clicky', 'Silent'].map((t) => ({ label: t, on: String(t === s.type), pick: () => this.setState({ type: t }) })),
      countLabel: list.length + (list.length === 1 ? ' switch' : ' switches'),
      cards: list.map((x) => ({ sw: x, isNew: !!x.isNew, detailLabel: x.name + ' details' }))
    };
  }
}
</script>
</body>
</html>
