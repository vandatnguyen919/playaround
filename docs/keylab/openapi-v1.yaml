        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /switches/{slug}/related:
    get:
      operationId: listRelatedSwitches
      tags:
      - Catalog
      summary: Switches that sound similar
      description: '**CAT-04** · access: Public · stories: US-04 · module: `catalog`.
        Other published switches, most similar first: the same sound profile, then the same
        type, then recorded before missing, then the nearest actuation force. One page only
        (`nextPageToken` is always null). Cached like CAT-01.'
      x-endpoint-id: CAT-04
      x-module: catalog
      x-stories:
      - US-04
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/slug'
      - name: page_size
        in: query
        description: How many to list. Four by default, the "Sounds similar" row.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 4
      responses:
        '200':
          description: OK
          headers:
            KeyLab-API-Revision:
              $ref: '#/components/headers/Revision'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SwitchSummary'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '304':
          description: Not modified (the `If-None-Match` tag still matches).
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
