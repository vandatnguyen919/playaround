# KeyLab API v1 · OpenAPI 3.1 · generated from docs/keylab/api-design-v1.md (draft, 2026-11-12)
openapi: 3.1.0
info:
  title: KeyLab API
  version: 1.0.0-draft+2026-11-08
  summary: Resource-oriented JSON API for the KeyLab app, marketing site and admin dashboard.
  description: |-
    Generated from the endpoint tables in api-design-v1.md; that doc explains the rules (versioning, paging, errors, concurrency). Every operation carries `x-endpoint-id` (CAT-01…), `x-stories` (US-xx), `x-module` (Spring Modulith module) and, when signed in, `x-required-role` (lowest Keycloak role).

    Versioning: the major version is in the path; additive changes ship inside v1 and are dated by the `KeyLab-API-Revision` response header. Deprecated versions send `Deprecation` and `Sunset` headers and answer `410 Gone` after the sunset date.
servers:
- url: https://keylab.app/bff/keylab/v1
  description: Browser, through the Spring Cloud Gateway BFF (session cookie).
- url: '{apiBase}/v1'
  description: keylab-api directly (bearer token, audience keylab-api).
  variables:
    apiBase:
      default: http://localhost:8183
security:
- bffSession: []
- bearerAuth: []
tags:
- name: System
  description: SYS · service status
- name: Catalog
  description: CAT · public, read-only catalog
- name: Builds
  description: BLD · builds and the sound recipe
- name: Me
  description: ME · the caller’s profile
- name: Social
  description: SOC · other people and community
- name: Account
  description: ACC · settings, identities, billing, export, deletion
- name: Admin
  description: ADM · /admin, Keycloak roles viewer < editor < admin
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - System
      summary: Service status and who the caller is
      description: '**SYS-01** · access: Public · stories: none (KL0 foundation) · module: `shared`. Reports the
        caller as keylab-api sees it, so one call through the BFF proves the route, token relay, audience and role
        mapping. A guest gets `authenticated: false`; a bad token gets 401.'
      x-endpoint-id: SYS-01
      x-module: shared
      x-stories: []
      security:
      - {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /switches:
    get:
      operationId: listSwitches
      tags:
      - Catalog
      summary: List switches
      description: '**CAT-01** · access: Public · stories: US-02, US-03, US-39 · module: `catalog`.
        Published switches only. `popular` lists the newest first until play counts exist.
        `force_min` and `force_max` are inclusive grams. Answers carry `Cache-Control:
        public, max-age=300` and an `ETag`; a matching `If-None-Match` gets `304`. A bad
        filter value is `400 invalid_parameter`; a `page_token` from another sort is
        `400 invalid_page_token`.'
      x-endpoint-id: CAT-01
      x-module: catalog
      x-stories:
      - US-02
      - US-03
      - US-39
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageToken'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - popular
          - -publishedAt
          - force
          default: popular
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/SwitchType'
      - name: profile
        in: query
        schema:
          $ref: '#/components/schemas/SoundProfile'
      - name: sound
        in: query
        schema:
          type: string
          enum:
          - recorded
          - missing
      - name: q
        in: query
        schema:
          type: string
      - name: is_new
        in: query
        schema:
          type: boolean
      - name: force_min
        in: query
        description: Lowest actuation force in grams, inclusive.
        schema:
          type: number
          minimum: 0
          maximum: 1000
      - name: force_max
        in: query
        description: Highest actuation force in grams, inclusive.
        schema:
          type: number
          minimum: 0
          maximum: 1000
      responses:
        '200':
          description: OK
          headers:
            KeyLab-API-Revision:
              $ref: '#/components/headers/Revision'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SwitchSummary'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '304':
          description: Not modified (the `If-None-Match` tag still matches).
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /switches/{slug}:
    get:
      operationId: getSwitch
      tags:
      - Catalog
      summary: Get one switch
      description: '**CAT-02** · access: Public · stories: US-04 · module: `catalog`.
        Published switches only: a draft, a pulled switch or an unknown slug is `404
        switch_not_found`. `include` takes `sounds`, `related` or both (comma separated);
        anything else is `400 invalid_parameter`. `related` embeds the four switches CAT-04
        lists first. Cached like CAT-01 (300 s, `ETag`, `304`).'
      x-endpoint-id: CAT-02
      x-module: catalog
      x-stories:
      - US-04
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/slug'
      - name: include
        in: query
        description: Comma-separated related records to embed, `sounds` and/or `related`.
        schema:
          type: string
        example: sounds,related
      responses:
        '200':
          description: OK
          headers:
            KeyLab-API-Revision:
              $ref: '#/components/headers/Revision'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switch'
        '304':
          description: Not modified (the `If-None-Match` tag still matches).
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /switches/{slug}/sounds:
    get:
      operationId: listSwitchSounds
      tags:
      - Catalog
      summary: Recordings by variant and stroke
      description: '**CAT-03** · access: Public · stories: US-03, US-04 · module: `catalog`.
        Ready recordings only, stock then lubed then foam, press before release. A published
        switch with none answers `data: []` and `soundStatus: missing`; anything not published
        is `404 switch_not_found`. Cached like CAT-01.'
      x-endpoint-id: CAT-03
      x-module: catalog
      x-stories:
      - US-03
