    WebhookEvent:
      type: object
      description: Provider-specific payload; verified by signature.
  parameters:
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    pageToken:
      name: page_token
      in: query
      schema:
        type: string
      description: Opaque; from page.nextPageToken.
    sort:
      name: sort
      in: query
      schema:
        type: string
      description: Field name, `-` prefix for descending.
    include:
      name: include
      in: query
      schema:
        type: string
      description: Comma-separated related records to embed.
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    buildId:
      name: build_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    username:
      name: username
      in: path
      required: true
      schema:
        type: string
    userId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    itemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum:
        - google
        - apple
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag from the last GET; stale tag → 412.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 64
      description: Replays within 24 h return the first result.
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
    Preview:
      name: KeyLab-Preview
      in: header
      schema:
        type: string
      description: Opt into a preview feature; no stability promise.
  headers:
    Revision:
      description: Date of the last additive release of v1.
      schema:
        type: string
        format: date
        examples:
        - '2026-11-08'
    ETag:
      schema:
        type: string
    Location:
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      schema:
        type: integer
    Deprecation:
      description: RFC 9745, set once v1 is deprecated.
      schema:
        type: string
        examples:
        - '@1798761600'
    Sunset:
      description: RFC 8594, set once v1 is deprecated.
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad syntax.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        KeyLab-API-Revision:
          $ref: '#/components/headers/Revision'
    Unauthorized:
      description: No session, or re-auth required (`reauth_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        KeyLab-API-Revision:
          $ref: '#/components/headers/Revision'
    Forbidden:
      description: Wrong role, or a private tab (`tab_private`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        KeyLab-API-Revision:
          $ref: '#/components/headers/Revision'
    NotFound:
      description: Not found, or private and not yours.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        KeyLab-API-Revision:
          $ref: '#/components/headers/Revision'
    Conflict:
      description: State conflict, see `code`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        KeyLab-API-Revision:
          $ref: '#/components/headers/Revision'
    Gone:
      description: This API version has been sunset; the body links the migration guide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        KeyLab-API-Revision:
          $ref: '#/components/headers/Revision'
    PreconditionFailed:
      description: Stale If-Match.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        KeyLab-API-Revision:
          $ref: '#/components/headers/Revision'
    Unprocessable:
      description: Validation failed; `errors` lists each field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        KeyLab-API-Revision:
          $ref: '#/components/headers/Revision'
    TooManyRequests:
      description: Rate limited.
      content:
