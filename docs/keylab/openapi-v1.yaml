components:
  securitySchemes:
    bffSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: BFF session cookie. Unsafe methods also send X-XSRF-TOKEN.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token relayed by the gateway; audience keylab-api.
    providerSignature:
      type: apiKey
      in: header
      name: Webhook-Signature
      description: Payment provider signature; ACC-08 only.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is stable and safe to switch on.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          examples:
          - validation_failed
          - missing_required_sounds
          - username_taken
          - slots_full
          - last_identity
          - reauth_required
          - tab_private
          - invalid_page_size
          - invalid_page_token
          - if_match_required
          - precondition_failed
          - invalid_idempotency_key
          - idempotency_key_reused
          - idempotency_in_progress
          - switch_not_found
          - switch_not_draft
          - slug_taken
          - photo_upload_unavailable
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
                description: JSON Pointer into the request body
              code:
                type: string
              message:
                type: string
            required:
            - pointer
            - code
            - message
      example:
        type: https://keylab.app/problems/validation
        title: Some fields need a fix
        status: 422
        code: validation_failed
        errors:
        - pointer: /username
          code: username_taken
          message: '@clackattack is taken. Try another.'
        - pointer: /links/website
          code: invalid_url
          message: Start with https:// and include a domain.
    Health:
      type: object
      required:
      - status
      - revision
      - authenticated
      - roles
      properties:
        status:
          type: string
          enum:
          - ok
        revision:
          type: string
          description: Same value as the `KeyLab-API-Revision` header.
          examples:
          - '2026-11-08'
        authenticated:
          type: boolean
        roles:
          type: array
          description: The caller's KeyLab roles (`keylab-*` only), sorted. Empty for a guest.
          items:
            type: string
            enum:
            - keylab-user
            - keylab-viewer
            - keylab-editor
            - keylab-admin
    PageInfo:
      type: object
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - pageSize
    SwitchType:
      type: string
      enum:
      - linear
      - tactile
      - clicky
      - silent
      description: New values may be added; treat unknown values as "other".
    SoundProfile:
      type: string
      enum:
      - deep
      - poppy
      - clacky
      - muted
      description: New values may be added; treat unknown values as "other".
    SoundStatus:
      type: string
      enum:
      - recorded
      - missing
      - processing
    Visibility:
      type: string
      enum:
      - public
      - private
    SwitchSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        brand:
          type: string
        type:
          $ref: '#/components/schemas/SwitchType'
        profile:
          $ref: '#/components/schemas/SoundProfile'
        stemColor:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        forceG:
          type: number
        actuationMm:
          type: number
        travelMm:
          type: number
        soundStatus:
          $ref: '#/components/schemas/SoundStatus'
        isNew:
          type: boolean
        publishedAt:
          type: string
          format: date-time
      required:
      - id
      - slug
      - name
      - type
      - soundStatus
      example:
        id: 0193f2c4-7a1e-7c5b-9d2e-4f8a1b3c5d6e
        slug: coral-pop
        name: Coral Pop
        brand: Clack Works
        type: tactile
        profile: poppy
        stemColor: '#F16B53'
        forceG: 62
        actuationMm: 2.0
        travelMm: 3.8
        soundStatus: recorded
        isNew: true
        publishedAt: '2026-11-02T03:42:00Z'
    ForceCurvePoint:
      type: object
      properties:
        travelMm:
          type: number
        forceG:
          type: number
        stroke:
          type: string
          enum:
          - press
          - release
      required:
      - travelMm
      - forceG
    Switch:
      allOf:
      - $ref: '#/components/schemas/SwitchSummary'
      - type: object
        properties:
          spring:
            type: string
          housing:
            type: string
          bottomOutG:
            type: number
          forceCurve:
            type: array
            items:
              $ref: '#/components/schemas/ForceCurvePoint'
          soundSummary:
            type: object
            properties:
              profile:
                $ref: '#/components/schemas/SoundProfile'
              word:
                type: string
                examples:
                - Deep & rounded
          sounds:
            description: Present with `include=sounds`.
            type: array
            items:
              $ref: '#/components/schemas/Recording'
          related:
            description: Present with `include=related`.
            type: array
            items:
              $ref: '#/components/schemas/SwitchSummary'
    Recording:
      type: object
      properties:
        id:
          type: string
          format: uuid
        variant:
          type: string
          enum:
          - stock
          - lubed
          - foam
        stroke:
          type: string
          enum:
          - press
          - release
        url:
          type: string
          format: uri
          description: Content-addressed CDN URL, never changes once published.
        durationMs:
          type: integer
        loudnessLufs:
          type: number
        peaks:
          type: array
          items:
            type: number
      required:
      - variant
      - stroke
      - url
    SwitchSounds:
      type: object
      properties:
        soundStatus:
          $ref: '#/components/schemas/SoundStatus'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Recording'
      required:
      - soundStatus
      - data
    KeycapSet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        material:
          type: string
          enum:
          - pbt
          - abs
          - pom
        profile:
          type: string
          enum:
          - cherry
          - oem
          - sa
          - xda
        colors:
          type: object
          properties:
            base:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            alpha:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            mod:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            accent:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
        soundShift:
          type: number
          minimum: -1
          maximum: 1
          description: -1 deeper … +1 brighter, relative to stock PBT Cherry.
        keys:
          type: integer
      required:
      - id
      - slug
      - name
      - material
      - profile
    Mod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        levels:
          type: array
          items:
            type: string
            examples:
            - none
            - light
            - heavy
        effects:
          type: object
          properties:
            pitch:
              type: integer
            thock:
              type: integer
            volume:
              type: integer
            rattle:
              type: integer
        live:
          type: boolean
      required:
      - id
      - slug
      - name
    CaseOptions:
      type: object
      properties:
        materials:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              colors:
                type: array
                items:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
              soundEffect:
                type: string
        plates:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              soundEffect:
                type: string
        mounts:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              soundEffect:
                type: string
      required:
      - materials
      - plates
      - mounts
    BuildParts:
      type: object
      properties:
        layout:
          type: string
          examples:
          - '60'
          - '65'
          - '75'
          - tkl
          - full
        switch:
          type: object
          properties:
            slug:
              type: string
            variant:
              type: string
              enum:
              - stock
              - lubed
              - foam
          required:
          - slug
        mods:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              level:
                type: string
            required:
            - slug
        keycaps:
          type: object
          properties:
            set:
              type: string
            profile:
              type: string
            material:
              type: string
        case:
          type: object
          properties:
            material:
              type: string
            color:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            plate:
              type: string
            mount:
              type: string
        deskPad:
          type: string
      required:
      - layout
      - switch
    BuildInput:
      allOf:
      - type: object
        properties:
          name:
            type: string
            maxLength: 60
          visibility:
            $ref: '#/components/schemas/Visibility'
        required:
        - name
      - $ref: '#/components/schemas/BuildParts'
      example:
        name: Night Thock 65
        visibility: public
        layout: '65'
        switch:
          slug: milk-yellow
          variant: lubed
        mods:
        - slug: lube
          level: light
        - slug: case-foam
        - slug: stab-tuning
        keycaps:
          set: navy-mustard
          profile: cherry
          material: pbt
        case:
          material: aluminum
          color: '#2B4677'
          plate: brass
          mount: gasket
        deskPad: sky
    Build:
      allOf:
      - type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
          visibility:
            $ref: '#/components/schemas/Visibility'
          owner:
            $ref: '#/components/schemas/UserRef'
          likeCount:
            type: integer
          copiedFrom:
            oneOf:
            - type: 'null'
            - type: object
              properties:
                buildId:
                  type: string
                  format: uuid
                owner:
                  $ref: '#/components/schemas/UserRef'
          version:
            type: integer
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
        required:
        - id
        - name
        - visibility
        - owner
        - createdAt
      - $ref: '#/components/schemas/BuildParts'
    BuildPatch:
      description: JSON Merge Patch (RFC 7396) of BuildInput.
      type: object
    PartsList:
      type: object
